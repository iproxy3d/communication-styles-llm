<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:44px;font-weight:700}.s{font-size:25px}.b{font-size:29px;font-weight:700}.c{font-size:22px;fill:#536078}.card{fill:#fff;stroke:#dfe4ed;stroke-width:2}</style></defs>
<rect width="1600" height="900" fill="#fbfaf7"/><text x="800" y="72" text-anchor="middle" class="t h">ОДНА ЭМОЦИЯ — РАЗНЫЕ СПОСОБЫ ВЫРАЖЕНИЯ</text><text x="800" y="112" text-anchor="middle" class="t s">Эмоция описывает внутреннее состояние. Стиль определяет форму речи.</text>
<rect x="560" y="158" width="480" height="150" rx="28" fill="#fff3df" stroke="#e2a64d" stroke-width="3"/><circle cx="655" cy="233" r="48" fill="#f4b654"/><path d="M635 222h40M640 252q15 14 30 0" fill="none" stroke="#6b4416" stroke-width="7" stroke-linecap="round"/><text x="745" y="220" class="t b">РАЗДРАЖЕНИЕ</text><text x="745" y="257" class="t c">одно внутреннее состояние</text>
<path d="M800 310v70M800 380H250v42M800 380H610v42M800 380h190v42M800 380h550v42" fill="none" stroke="#9aa4b6" stroke-width="4"/>
<rect x="70" y="420" width="360" height="310" rx="24" class="card"/><rect x="70" y="420" width="360" height="68" rx="24" fill="#e9f8f1"/><text x="250" y="464" text-anchor="middle" class="t b">Дружеский</text><text x="105" y="535" class="t s">«Ну вот, опять эта</text><text x="105" y="570" class="t s">история. Давай</text><text x="105" y="605" class="t s">разберёмся».</text><text x="105" y="675" class="t c">разговорно · близко</text>
<rect x="440" y="420" width="360" height="310" rx="24" class="card"/><rect x="440" y="420" width="360" height="68" rx="24" fill="#eaf1ff"/><text x="620" y="464" text-anchor="middle" class="t b">Формальный</text><text x="475" y="535" class="t s">«Прошу сохранять</text><text x="475" y="570" class="t s">корректный тон».</text><text x="475" y="675" class="t c">дистанция · процедура</text>
<rect x="810" y="420" width="360" height="310" rx="24" class="card"/><rect x="810" y="420" width="360" height="68" rx="24" fill="#f2edff"/><text x="990" y="464" text-anchor="middle" class="t b">Ироничный</text><text x="845" y="535" class="t s">«Прекрасно. Именно</text><text x="845" y="570" class="t s">этого нам ещё</text><text x="845" y="605" class="t s">не хватало».</text><text x="845" y="675" class="t c">непрямая оценка · юмор</text>
<rect x="1180" y="420" width="350" height="310" rx="24" class="card"/><rect x="1180" y="420" width="350" height="68" rx="24" fill="#eef2f4"/><text x="1355" y="464" text-anchor="middle" class="t b">Холодный</text><text x="1215" y="535" class="t s">«Ваше раздражение</text><text x="1215" y="570" class="t s">ситуацию</text><text x="1215" y="605" class="t s">не изменит».</text><text x="1215" y="675" class="t c">кратко · отстранённо</text>
<rect x="235" y="780" width="1130" height="72" rx="20" fill="#f3f0ff"/><text x="800" y="826" text-anchor="middle" class="t s">Стиль — самостоятельная настройка персонажа, а не название эмоции.</text>
</svg>
