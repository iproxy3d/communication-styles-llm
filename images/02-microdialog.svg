<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:44px;font-weight:700}.b{font-size:28px;font-weight:700}.s{font-size:25px}.c{font-size:21px;fill:#5f6b7f}.box{fill:#fff;stroke:#dce2ec;stroke-width:2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7560c9"/></marker></defs>
<rect width="1600" height="900" fill="#faf9fd"/><text x="800" y="70" text-anchor="middle" class="t h">МИКРОДИАЛОГ — СКРЫТЫЙ ЛОКАЛЬНЫЙ ПРИМЕР</text><text x="800" y="112" text-anchor="middle" class="t s">Он показывает LLM манеру продолжения непосредственно перед ответом.</text>
<rect x="70" y="175" width="370" height="460" rx="26" class="box"/><text x="255" y="230" text-anchor="middle" class="t b">Реальная история</text><rect x="105" y="280" width="300" height="85" rx="18" fill="#edf2fb"/><text x="130" y="318" class="t c">Пользователь:</text><text x="130" y="350" class="t s">«Билетов нет?»</text><rect x="105" y="390" width="300" height="105" rx="18" fill="#f1efff"/><text x="130" y="428" class="t c">Агент:</text><text x="130" y="460" class="t s">«К сожалению, нет».</text><text x="255" y="575" text-anchor="middle" class="t c">Факты и предметный контекст</text>
<path d="M450 405h120" stroke="#7560c9" stroke-width="5" marker-end="url(#a)"/>
<rect x="585" y="150" width="430" height="510" rx="26" fill="#f5f1ff" stroke="#8b72df" stroke-width="3" stroke-dasharray="12 9"/><text x="800" y="210" text-anchor="middle" class="t b">Скрытая вставка</text><text x="800" y="246" text-anchor="middle" class="t c">пользователь её не видит</text><rect x="630" y="305" width="340" height="105" rx="20" fill="#fff"/><text x="660" y="343" class="t c">Персонаж:</text><text x="660" y="378" class="t s">«Вот это раздражает».</text><rect x="630" y="432" width="340" height="105" rx="20" fill="#fff"/><text x="660" y="470" class="t c">Собеседник:</text><text x="660" y="505" class="t s">«И что теперь?»</text><text x="800" y="600" text-anchor="middle" class="t c">Ритм · лексика · дистанция</text>
<path d="M1025 405h120" stroke="#7560c9" stroke-width="5" marker-end="url(#a)"/>
<rect x="1160" y="175" width="370" height="460" rx="26" class="box"/><text x="1345" y="230" text-anchor="middle" class="t b">Текущий ответ</text><rect x="1195" y="285" width="300" height="175" rx="20" fill="#eaf8f4"/><text x="1225" y="328" class="t c">LLM:</text><text x="1225" y="368" class="t s">«Давайте без</text><text x="1225" y="403" class="t s">оскорблений и</text><text x="1225" y="438" class="t s">найдём другой рейс».</text><text x="1345" y="535" text-anchor="middle" class="t c">Смысл сохранён,</text><text x="1345" y="568" text-anchor="middle" class="t c">форма изменилась</text>
<rect x="180" y="735" width="1240" height="95" rx="24" fill="#fff3e7"/><text x="800" y="777" text-anchor="middle" class="t b">Микродиалог преимущественно не содержит предметных фактов</text><text x="800" y="815" text-anchor="middle" class="t c">Иначе вымышленная деталь может попасть в реальный ответ.</text>
</svg>
