<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:44px;font-weight:700}.b{font-size:29px;font-weight:700}.s{font-size:24px}.c{font-size:20px;fill:#5d687a}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker></defs><rect width="1600" height="900" fill="#fbfcfe"/><text x="800" y="70" text-anchor="middle" class="t h">GLOBAL POLICY И LOCAL POLICY(t)</text><text x="800" y="110" text-anchor="middle" class="t s">Постоянные правила и динамическая манера не конкурируют — они дополняют друг друга.</text>
<rect x="80" y="175" width="420" height="530" rx="28" fill="#edf4ff" stroke="#5b83c7" stroke-width="3"/><text x="290" y="235" text-anchor="middle" class="t b">Системный промпт</text><text x="290" y="275" text-anchor="middle" class="t c">GLOBAL POLICY</text><line x1="125" y1="310" x2="455" y2="310" stroke="#bfd0ea" stroke-width="2"/><text x="130" y="365" class="t s">• роль и цель агента</text><text x="130" y="415" class="t s">• безопасность</text><text x="130" y="465" class="t s">• бизнес-правила</text><text x="130" y="515" class="t s">• постоянный характер</text><rect x="125" y="575" width="330" height="80" rx="16" fill="#fff"/><text x="290" y="610" text-anchor="middle" class="t c">Одинаков на многих шагах</text><text x="290" y="640" text-anchor="middle" class="t c">и во всех ситуациях</text>
<path d="M520 440h160" stroke="#667085" stroke-width="5" marker-end="url(#a)"/>
<rect x="695" y="145" width="480" height="590" rx="28" fill="#f4efff" stroke="#8067d5" stroke-width="3"/><text x="935" y="205" text-anchor="middle" class="t b">Динамический микродиалог</text><text x="935" y="245" text-anchor="middle" class="t c">LOCAL POLICY(t)</text><line x1="740" y1="280" x2="1130" y2="280" stroke="#d4c9f3" stroke-width="2"/><text x="750" y="335" class="t s">• выбранное состояние</text><text x="750" y="385" class="t s">• манера этой реплики</text><text x="750" y="435" class="t s">• текущая интенсивность</text><text x="750" y="485" class="t s">• актуальный сценарий</text><rect x="750" y="545" width="370" height="120" rx="16" fill="#fff"/><text x="935" y="585" text-anchor="middle" class="t c">На следующем шаге</text><text x="935" y="618" text-anchor="middle" class="t c">может быть выбран</text><text x="935" y="651" text-anchor="middle" class="t c">другой микродиалог</text>
<path d="M1195 440h150" stroke="#667085" stroke-width="5" marker-end="url(#a)"/><rect x="1360" y="325" width="170" height="230" rx="28" fill="#eaf8f3" stroke="#43a07c" stroke-width="3"/><text x="1445" y="400" text-anchor="middle" class="t b">LLM</text><text x="1445" y="448" text-anchor="middle" class="t s">текущий</text><text x="1445" y="483" text-anchor="middle" class="t s">ответ</text>
<rect x="300" y="785" width="1000" height="68" rx="20" fill="#fff5e9"/><text x="800" y="829" text-anchor="middle" class="t s">Постоянные ограничения остаются сильнее локальной стилевой вставки.</text></svg>
