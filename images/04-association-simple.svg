<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:44px;font-weight:700}.b{font-size:30px;font-weight:700}.s{font-size:24px}.c{font-size:20px;fill:#5d687a}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7560c9"/></marker></defs><rect width="1600" height="900" fill="#fbfaf7"/><text x="800" y="72" text-anchor="middle" class="t h">ПРОШЛЫЙ ОПЫТ МЕНЯЕТ ФОРМУ НОВОЙ РЕАКЦИИ</text><text x="800" y="112" text-anchor="middle" class="t s">Ассоциативная память связывает сущность с эмоциональным следом.</text>
<rect x="80" y="230" width="310" height="320" rx="28" fill="#fff" stroke="#dfe4ed" stroke-width="3"/><circle cx="235" cy="325" r="66" fill="#e8efff"/><circle cx="235" cy="300" r="24" fill="none" stroke="#426fb8" stroke-width="7"/><path d="M185 365q50-62 100 0" fill="none" stroke="#426fb8" stroke-width="7"/><text x="235" y="440" text-anchor="middle" class="t b">«Иванов»</text><text x="235" y="485" text-anchor="middle" class="t c">обнаруженная сущность</text><path d="M405 390h130" stroke="#7560c9" stroke-width="5" marker-end="url(#a)"/>
<rect x="550" y="185" width="420" height="410" rx="28" fill="#f4efff" stroke="#8067d5" stroke-width="3"/><text x="760" y="245" text-anchor="middle" class="t b">Память отношений</text><text x="600" y="315" class="t s">прошлый диалог</text><rect x="600" y="340" width="320" height="18" rx="9" fill="#e0d9f4"/><rect x="600" y="340" width="230" height="18" rx="9" fill="#d76058"/><text x="600" y="410" class="t s">раздражение</text><text x="860" y="410" class="t b">0,6</text><text x="600" y="470" class="t s">настороженность</text><text x="860" y="470" class="t b">0,4</text><text x="760" y="545" text-anchor="middle" class="t c">связь меняется постепенно</text><path d="M990 390h130" stroke="#7560c9" stroke-width="5" marker-end="url(#a)"/>
<rect x="1135" y="230" width="385" height="320" rx="28" fill="#eaf8f3" stroke="#42a07c" stroke-width="3"/><text x="1327" y="300" text-anchor="middle" class="t b">Новый ответ</text><text x="1185" y="370" class="t s">«Привет.</text><text x="1185" y="410" class="t s">Слушаю тебя».</text><text x="1327" y="485" text-anchor="middle" class="t c">нейтральный смысл,</text><text x="1327" y="518" text-anchor="middle" class="t c">чуть больше дистанции</text>
<rect x="250" y="690" width="1100" height="120" rx="24" fill="#fff4e7"/><text x="800" y="735" text-anchor="middle" class="t b">Память не диктует реакцию</text><text x="800" y="775" text-anchor="middle" class="t s">Она добавляет слабое смещение, которое уравновешивают ситуация и состояние агента.</text></svg>
