<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:44px;font-weight:700}.b{font-size:27px;font-weight:700}.s{font-size:22px}.c{font-size:18px;fill:#5d687a}</style></defs><rect width="1600" height="900" fill="#f8fcfb"/><text x="800" y="70" text-anchor="middle" class="t h">ОДИН ФАКТ — ДВА РАЗНЫХ ПОЛЬЗОВАТЕЛЬСКИХ ОПЫТА</text><text x="800" y="110" text-anchor="middle" class="t s">В обоих случаях билетов нет. Меняется только способ реакции агента.</text>
<rect x="70" y="175" width="700" height="585" rx="28" fill="#f2f5f8" stroke="#a8b4c4" stroke-width="3"/><text x="420" y="235" text-anchor="middle" class="t b">БЕЗ ДИНАМИЧЕСКОГО СТИЛЯ</text><rect x="125" y="290" width="590" height="90" rx="18" fill="#fff"/><text x="160" y="328" class="t c">Агент:</text><text x="160" y="360" class="t s">«К сожалению, билетов на этот рейс нет».</text><rect x="125" y="405" width="590" height="90" rx="18" fill="#e8edf4"/><text x="160" y="443" class="t c">Пользователь:</text><text x="160" y="475" class="t s">«Тупица! Я опоздаю на самолёт!»</text><rect x="125" y="520" width="590" height="145" rx="18" fill="#fff"/><text x="160" y="558" class="t c">Ответ:</text><text x="160" y="595" class="t s">«Понимаю ваше раздражение.</text><text x="160" y="630" class="t s">Давайте попробуем найти другой рейс».</text><text x="420" y="715" text-anchor="middle" class="t c">корректно, но почти без реакции на ситуацию</text>
<rect x="830" y="175" width="700" height="585" rx="28" fill="#eef9f6" stroke="#319278" stroke-width="3"/><text x="1180" y="235" text-anchor="middle" class="t b">С ДИНАМИЧЕСКИМ СТИЛЕМ</text><rect x="885" y="290" width="590" height="90" rx="18" fill="#fff"/><text x="920" y="328" class="t c">Агент:</text><text x="920" y="360" class="t s">«К сожалению, билетов на этот рейс нет».</text><rect x="885" y="405" width="590" height="90" rx="18" fill="#e8edf4"/><text x="920" y="443" class="t c">Пользователь:</text><text x="920" y="475" class="t s">«Тупица! Я опоздаю на самолёт!»</text><rect x="885" y="520" width="590" height="145" rx="18" fill="#fff"/><text x="920" y="558" class="t c">Ответ:</text><text x="920" y="595" class="t s">«Я тоже не в восторге. Давайте без</text><text x="920" y="630" class="t s">оскорблений и найдём другой рейс».</text><text x="1180" y="715" text-anchor="middle" class="t c">факт сохранён, социальная реакция стала правдоподобнее</text>
<rect x="250" y="810" width="1100" height="60" rx="18" fill="#fff4e5"/><text x="800" y="849" text-anchor="middle" class="t s">Микродиалог меняет форму реакции, но не бизнес-факт и не цель агента.</text></svg>
