<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:44px;font-weight:700}.b{font-size:28px;font-weight:700}.s{font-size:23px}.c{font-size:19px;fill:#596578}.box{fill:#fff;stroke:#dfe4ec;stroke-width:2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17847e"/></marker></defs><rect width="1600" height="900" fill="#f8fcfb"/><text x="800" y="70" text-anchor="middle" class="t h">ОДНА LLM — РАЗНЫЕ ПОВЕДЕНЧЕСКИЕ ПОЛИТИКИ</text><text x="800" y="110" text-anchor="middle" class="t s">Смысловая задача остаётся общей, а манера ответа соответствует продуктовой роли.</text>
<rect x="590" y="155" width="420" height="160" rx="28" fill="#e9f6f4" stroke="#17847e" stroke-width="3"/><text x="800" y="220" text-anchor="middle" class="t h">LLM</text><text x="800" y="265" text-anchor="middle" class="t s">общий языковой движок</text><path d="M800 320v75M800 395H275v55M800 395v55M800 395h525v55" fill="none" stroke="#17847e" stroke-width="5"/>
<rect x="60" y="450" width="430" height="330" rx="26" class="box"/><rect x="60" y="450" width="430" height="70" rx="26" fill="#e8f7ef"/><text x="275" y="495" text-anchor="middle" class="t b">Служба поддержки</text><text x="100" y="575" class="t s">Спокойно и конструктивно</text><text x="100" y="620" class="t s">снижает напряжение</text><rect x="100" y="680" width="350" height="60" rx="15" fill="#f2faf6"/><text x="275" y="718" text-anchor="middle" class="t c">цель: решить задачу</text>
<rect x="585" y="450" width="430" height="330" rx="26" class="box"/><rect x="585" y="450" width="430" height="70" rx="26" fill="#fff3df"/><text x="800" y="495" text-anchor="middle" class="t b">Тренажёр переговоров</text><text x="625" y="575" class="t s">Отражает выбранный</text><text x="625" y="620" class="t s">тип оппонента</text><rect x="625" y="680" width="350" height="60" rx="15" fill="#fff9ef"/><text x="800" y="718" text-anchor="middle" class="t c">цель: тренировать стратегию</text>
<rect x="1110" y="450" width="430" height="330" rx="26" class="box"/><rect x="1110" y="450" width="430" height="70" rx="26" fill="#f2edff"/><text x="1325" y="495" text-anchor="middle" class="t b">Игровой персонаж</text><text x="1150" y="575" class="t s">Ярко выражает характер</text><text x="1150" y="620" class="t s">и историю отношений</text><rect x="1150" y="680" width="350" height="60" rx="15" fill="#f8f5ff"/><text x="1325" y="718" text-anchor="middle" class="t c">цель: правдоподобная роль</text>
<text x="800" y="850" text-anchor="middle" class="t s">Меняется policy коммуникации, но не знания и не бизнес-правила.</text></svg>
