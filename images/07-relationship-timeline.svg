<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:44px;font-weight:700}.b{font-size:27px;font-weight:700}.s{font-size:22px}.c{font-size:18px;fill:#5d687a}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17847e"/></marker></defs><rect width="1600" height="900" fill="#f8fcfb"/><text x="800" y="70" text-anchor="middle" class="t h">ОДИН ПЕРСОНАЖ МЕНЯЕТСЯ ВО ВРЕМЕНИ</text><text x="800" y="110" text-anchor="middle" class="t s">Состояние накапливается и ослабевает постепенно, а не переключается по одной реплике.</text>
<path d="M190 400H1410" stroke="#b9dcd8" stroke-width="12" stroke-linecap="round"/><path d="M390 400h105M750 400h105M1110 400h105" stroke="#17847e" stroke-width="5" marker-end="url(#a)"/>
<g><circle cx="220" cy="400" r="72" fill="#e8f7ef" stroke="#3da47b" stroke-width="4"/><text x="220" y="410" text-anchor="middle" class="t b">1</text><text x="220" y="525" text-anchor="middle" class="t b">Начало</text><text x="220" y="562" text-anchor="middle" class="t c">спокойный стиль</text><rect x="110" y="600" width="220" height="20" rx="10" fill="#e5eceb"/><rect x="110" y="600" width="45" height="20" rx="10" fill="#3da47b"/></g>
<g><circle cx="580" cy="400" r="72" fill="#fff7e8" stroke="#dda148" stroke-width="4"/><text x="580" y="410" text-anchor="middle" class="t b">2</text><text x="580" y="525" text-anchor="middle" class="t b">Повторная грубость</text><text x="580" y="562" text-anchor="middle" class="t c">обозначает границы</text><rect x="470" y="600" width="220" height="20" rx="10" fill="#e5eceb"/><rect x="470" y="600" width="120" height="20" rx="10" fill="#dda148"/></g>
<g><circle cx="940" cy="400" r="72" fill="#ffeded" stroke="#cf625b" stroke-width="4"/><text x="940" y="410" text-anchor="middle" class="t b">3</text><text x="940" y="525" text-anchor="middle" class="t b">Конфликт</text><text x="940" y="562" text-anchor="middle" class="t c">короче и жёстче</text><rect x="830" y="600" width="220" height="20" rx="10" fill="#e5eceb"/><rect x="830" y="600" width="195" height="20" rx="10" fill="#cf625b"/></g>
<g><circle cx="1300" cy="400" r="72" fill="#edf5ff" stroke="#5a86c8" stroke-width="4"/><text x="1300" y="410" text-anchor="middle" class="t b">4</text><text x="1300" y="525" text-anchor="middle" class="t b">Примирение</text><text x="1300" y="562" text-anchor="middle" class="t c">плавный возврат</text><rect x="1190" y="600" width="220" height="20" rx="10" fill="#e5eceb"/><rect x="1190" y="600" width="90" height="20" rx="10" fill="#5a86c8"/></g>
<rect x="280" y="730" width="1040" height="92" rx="23" fill="#eaf8f6"/><text x="800" y="773" text-anchor="middle" class="t b">Динамика создаёт непрерывность личности</text><text x="800" y="808" text-anchor="middle" class="t c">Пользователь видит последствия собственной стратегии общения.</text></svg>
