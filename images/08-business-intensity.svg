<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:44px;font-weight:700}.b{font-size:27px;font-weight:700}.s{font-size:22px}.c{font-size:18px;fill:#5d687a}.card{fill:#fff;stroke:#dfe4ed;stroke-width:2}</style></defs><rect width="1600" height="900" fill="#f8fcfb"/><text x="800" y="70" text-anchor="middle" class="t h">НАСКОЛЬКО ЗАМЕТНО ДОЛЖЕН ПРОЯВЛЯТЬСЯ СТИЛЬ?</text><text x="800" y="110" text-anchor="middle" class="t s">Для менеджера это один понятный регулятор; внутренняя реализация остаётся технической.</text>
<rect x="80" y="200" width="330" height="430" rx="26" class="card"/><rect x="80" y="200" width="330" height="78" rx="26" fill="#eef2f5"/><text x="245" y="250" text-anchor="middle" class="t b">Нейтрально</text><text x="120" y="345" class="t s">Без дополнительной</text><text x="120" y="380" class="t s">вставки</text><text x="120" y="470" class="t c">• справочный ответ</text><text x="120" y="510" class="t c">• минимальная вариативность</text>
<rect x="450" y="200" width="330" height="430" rx="26" class="card"/><rect x="450" y="200" width="330" height="78" rx="26" fill="#e8f7ef"/><text x="615" y="250" text-anchor="middle" class="t b">Слабо</text><text x="490" y="345" class="t s">Отдельные слова</text><text x="490" y="380" class="t s">и формальность</text><text x="490" y="470" class="t c">• поддержка</text><text x="490" y="510" class="t c">• деловые ассистенты</text>
<rect x="820" y="200" width="330" height="430" rx="26" class="card"/><rect x="820" y="200" width="330" height="78" rx="26" fill="#fff4df"/><text x="985" y="250" text-anchor="middle" class="t b">Заметно</text><text x="860" y="345" class="t s">Ритм, прямота</text><text x="860" y="380" class="t s">и манера реакции</text><text x="860" y="470" class="t c">• обучение</text><text x="860" y="510" class="t c">• переговорные симуляции</text>
<rect x="1190" y="200" width="330" height="430" rx="26" class="card"/><rect x="1190" y="200" width="330" height="78" rx="26" fill="#f2edff"/><text x="1355" y="250" text-anchor="middle" class="t b">Ярко</text><text x="1230" y="345" class="t s">Стиль влияет</text><text x="1230" y="380" class="t s">на весь ответ</text><text x="1230" y="470" class="t c">• игры и персонажи</text><text x="1230" y="510" class="t c">• художественные сценарии</text>
<rect x="165" y="710" width="1270" height="105" rx="23" fill="#fff5e9"/><text x="800" y="753" text-anchor="middle" class="t b">Смысл и безопасность контролируются отдельно</text><text x="800" y="792" text-anchor="middle" class="t c">Чем сильнее стилевое воздействие, тем важнее проверка сохранности содержания.</text></svg>
