<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
<defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:42px;font-weight:700}.b{font-size:25px;font-weight:700}.s{font-size:19px}.c{font-size:16px;fill:#5d687a}.m{font-family:Georgia,serif;font-style:italic;font-size:34px;font-weight:700}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5674b9"/></marker></defs>
<rect width="1800" height="1040" fill="#f8faff"/><text x="900" y="60" text-anchor="middle" class="t h">ПОЛНЫЙ КОНТУР ФОРМИРОВАНИЯ ОТВЕТА</text>
<text x="55" y="120" class="t b">1. ИСТОЧНИКИ СОСТОЯНИЯ</text>
<rect x="45" y="155" width="350" height="145" rx="22" fill="#edf4ff" stroke="#5278c8" stroke-width="3"/><text x="90" y="207" class="t m">Uₜ</text><text x="160" y="205" class="t b">Собеседник</text><text x="90" y="250" class="t s">эмоции текущей реплики</text>
<rect x="45" y="330" width="350" height="145" rx="22" fill="#eef8f2" stroke="#4c9c72" stroke-width="3"/><text x="90" y="382" class="t m">Eₜ</text><text x="160" y="380" class="t b">Состояние агента</text><text x="90" y="425" class="t s">эмоциональная история</text>
<rect x="45" y="505" width="350" height="165" rx="22" fill="#f4efff" stroke="#8564c7" stroke-width="3"/><text x="90" y="557" class="t m">Aₜ</text><text x="160" y="555" class="t b">Ассоциации</text><text x="90" y="600" class="t s">люди · события · объекты</text><text x="90" y="635" class="t c">опциональная память опыта</text>
<path d="M410 230h90M410 405h90M410 585h90" stroke="#5674b9" stroke-width="5" marker-end="url(#a)"/>
<rect x="520" y="250" width="330" height="330" rx="28" fill="#fff5df" stroke="#d99a3b" stroke-width="3"/><text x="685" y="305" text-anchor="middle" class="t b">2. СОСТОЯНИЕ ОТВЕТА</text><text x="685" y="370" text-anchor="middle" class="t m">Sₜ</text><text x="685" y="420" text-anchor="middle" class="t s">смешение трёх источников</text><text x="685" y="475" text-anchor="middle" class="t s">Sₜ = αUₜ + (1−α)Eₜ + βAₜ</text><text x="685" y="525" text-anchor="middle" class="t c">нормализация определяется системой</text>
<path d="M870 415h90" stroke="#5674b9" stroke-width="5" marker-end="url(#a)"/>
<rect x="980" y="190" width="350" height="450" rx="28" fill="#fff0f4" stroke="#cf688b" stroke-width="3"/><text x="1155" y="245" text-anchor="middle" class="t b">3. ПОЛИТИКА ПЕРСОНАЖА</text><text x="1155" y="300" text-anchor="middle" class="t s">выбрать стиль и поле эмоции</text><rect x="1025" y="335" width="260" height="105" rx="18" fill="#fff"/><text x="1155" y="377" text-anchor="middle" class="t b">Микродиалог Mₜ</text><text x="1155" y="412" text-anchor="middle" class="t s">коммуникационный</text><text x="1155" y="485" text-anchor="middle" class="t s">интенсивность Iₜ</text><rect x="1025" y="520" width="260" height="80" rx="18" fill="#fff"/><text x="1155" y="552" text-anchor="middle" class="t b">Мотивация mᵐᵒᵗₜ</text><text x="1155" y="582" text-anchor="middle" class="t s">выбирает Qₜ</text>
<path d="M1350 415h80" stroke="#5674b9" stroke-width="5" marker-end="url(#a)"/>
<rect x="1450" y="170" width="300" height="490" rx="28" fill="#edf4ff" stroke="#5278c8" stroke-width="3"/><text x="1600" y="225" text-anchor="middle" class="t b">4. КОНТЕКСТ Cₜ</text><rect x="1490" y="265" width="220" height="70" rx="15" fill="#fff"/><text x="1600" y="308" text-anchor="middle" class="t s">История Hₜ</text><rect x="1490" y="355" width="220" height="80" rx="15" fill="#fff0f4"/><text x="1600" y="389" text-anchor="middle" class="t s">Стилевой</text><text x="1600" y="418" text-anchor="middle" class="t s">микродиалог Mₜ</text><rect x="1490" y="455" width="220" height="80" rx="15" fill="#eaf7f0"/><text x="1600" y="489" text-anchor="middle" class="t s">Мотивационный</text><text x="1600" y="518" text-anchor="middle" class="t s">микродиалог Qₜ</text><rect x="1490" y="555" width="220" height="70" rx="15" fill="#fff"/><text x="1600" y="598" text-anchor="middle" class="t s">Сообщение Xₜ</text>
<path d="M1600 680v80" stroke="#5674b9" stroke-width="5" marker-end="url(#a)"/><rect x="1360" y="780" width="390" height="105" rx="24" fill="#eef8f2" stroke="#4c9c72" stroke-width="3"/><text x="1555" y="825" text-anchor="middle" class="t b">5. LLM → ОТВЕТ Yₜ</text><text x="1555" y="858" text-anchor="middle" class="t c">содержание · манера · активность</text>
<path d="M1550 905C1380 985 500 985 220 690" fill="none" stroke="#4c9c72" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#a)"/><rect x="560" y="900" width="680" height="75" rx="20" fill="#eef8f2"/><text x="900" y="935" text-anchor="middle" class="t b">ОБНОВЛЕНИЕ СОСТОЯНИЯ И ПАМЯТИ</text><text x="900" y="963" text-anchor="middle" class="t c">реальный ответ и новый опыт влияют на следующие шаги</text>
<rect x="65" y="780" width="1060" height="105" rx="24" fill="#fff" stroke="#d5ddea" stroke-width="2"/><text x="95" y="820" class="t b">Важное разделение</text><text x="95" y="856" class="t s">Стиль определяет форму выражения. Мотивация регулирует активность. LLM формирует содержание ответа.</text>
</svg>
