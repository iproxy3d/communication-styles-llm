<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.m{font-family:Georgia,serif;fill:#17233b}.h{font-size:44px;font-weight:700}.f{font-size:52px}.b{font-size:27px;font-weight:700}.s{font-size:22px}.c{font-size:18px;fill:#5d687a}.card{fill:#fff;stroke:#dce3ee;stroke-width:2}</style></defs><rect width="1600" height="900" fill="#f8fbff"/><text x="800" y="68" text-anchor="middle" class="t h">ПАРАМЕТР α: АДАПТАЦИЯ И СОБСТВЕННОЕ СОСТОЯНИЕ</text><rect x="360" y="115" width="880" height="110" rx="24" fill="#edf4ff" stroke="#7296cb" stroke-width="2"/><text x="800" y="185" text-anchor="middle" class="m f">Sₜ = αUₜ + (1 − α)Eₜ</text>
<rect x="60" y="290" width="460" height="400" rx="26" class="card"/><rect x="60" y="290" width="460" height="75" rx="26" fill="#ffeded"/><text x="290" y="338" text-anchor="middle" class="t b">α → 1</text><text x="105" y="420" class="t s">Стиль быстро подстраивается</text><text x="105" y="455" class="t s">под эмоции собеседника.</text><text x="105" y="535" class="t c">Плюс: сильная эмпатическая адаптация</text><text x="105" y="580" class="t c">Риск: механическое зеркалирование</text><rect x="105" y="625" width="370" height="18" rx="9" fill="#e6ebf2"/><rect x="105" y="625" width="340" height="18" rx="9" fill="#d65c58"/>
<rect x="570" y="290" width="460" height="400" rx="26" class="card"/><rect x="570" y="290" width="460" height="75" rx="26" fill="#fff5df"/><text x="800" y="338" text-anchor="middle" class="t b">0 &lt; α &lt; 1</text><text x="615" y="420" class="t s">Собеседник влияет, но состояние</text><text x="615" y="455" class="t s">агента сохраняет инерцию.</text><text x="615" y="535" class="t c">Баланс реакции и характера</text><text x="615" y="580" class="t c">Основной рабочий диапазон</text><rect x="615" y="625" width="370" height="18" rx="9" fill="#e6ebf2"/><rect x="615" y="625" width="210" height="18" rx="9" fill="#dca145"/>
<rect x="1080" y="290" width="460" height="400" rx="26" class="card"/><rect x="1080" y="290" width="460" height="75" rx="26" fill="#e8f7ef"/><text x="1310" y="338" text-anchor="middle" class="t b">α → 0</text><text x="1125" y="420" class="t s">Стиль определяется текущим</text><text x="1125" y="455" class="t s">состоянием самого агента.</text><text x="1125" y="535" class="t c">Плюс: устойчивая личность</text><text x="1125" y="580" class="t c">Риск: слабая адаптация</text><rect x="1125" y="625" width="370" height="18" rx="9" fill="#e6ebf2"/><rect x="1125" y="625" width="40" height="18" rx="9" fill="#3fa17b"/>
<rect x="230" y="760" width="1140" height="80" rx="22" fill="#edf4ff"/><text x="800" y="810" text-anchor="middle" class="t s">Sₜ используется для выбора коммуникации и не заменяет Eₜ.</text></svg>
