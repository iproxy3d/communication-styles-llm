<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:44px;font-weight:700}.b{font-size:26px;font-weight:700}.s{font-size:21px}.c{font-size:18px;fill:#5d687a}</style></defs><rect width="1600" height="900" fill="#f8fbff"/><text x="800" y="70" text-anchor="middle" class="t h">ИНТЕНСИВНОСТЬ — НЕ ТОЛЬКО КОЛИЧЕСТВО РЕПЛИК</text><text x="800" y="110" text-anchor="middle" class="t s">Степень воздействия складывается из нескольких управляемых факторов.</text>
<rect x="90" y="180" width="1420" height="170" rx="28" fill="#edf4ff" stroke="#7598ca" stroke-width="2"/><text x="800" y="230" text-anchor="middle" class="t b">Iₜ = G(шаблон, выразительность, длина, число примеров, позиция)</text><text x="170" y="300" class="t s">Выбор шаблона</text><text x="450" y="300" class="t s">Сила лексики</text><text x="710" y="300" class="t s">Число реплик</text><text x="955" y="300" class="t s">Длина вставки</text><text x="1225" y="300" class="t s">Положение в контексте</text>
<rect x="90" y="420" width="430" height="290" rx="25" fill="#e8f7ef"/><text x="305" y="475" text-anchor="middle" class="t b">Слабое воздействие</text><text x="135" y="540" class="t s">• один короткий пример</text><text x="135" y="580" class="t s">• нейтральная лексика</text><text x="135" y="620" class="t s">• высокая сохранность смысла</text>
<rect x="585" y="420" width="430" height="290" rx="25" fill="#fff4df"/><text x="800" y="475" text-anchor="middle" class="t b">Умеренное воздействие</text><text x="630" y="540" class="t s">• выраженный шаблон</text><text x="630" y="580" class="t s">• несколько стилевых маркеров</text><text x="630" y="620" class="t s">• контролируемая вариативность</text>
<rect x="1080" y="420" width="430" height="290" rx="25" fill="#ffeded"/><text x="1295" y="475" text-anchor="middle" class="t b">Сильное воздействие</text><text x="1125" y="540" class="t s">• несколько локальных примеров</text><text x="1125" y="580" class="t s">• яркая манера</text><text x="1125" y="620" class="t s">• выше риск вытеснения смысла</text>
<rect x="250" y="770" width="1100" height="76" rx="20" fill="#fff5e9"/><text x="800" y="818" text-anchor="middle" class="t s">Функцию Iₜ нужно калибровать отдельно для каждой LLM и сценария.</text></svg>
