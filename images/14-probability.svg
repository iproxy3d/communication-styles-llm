<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.m{font-family:Georgia,serif;fill:#17233b}.h{font-size:44px;font-weight:700}.b{font-size:26px;font-weight:700}.s{font-size:21px}.c{font-size:18px;fill:#5d687a}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#547db7"/></marker></defs><rect width="1600" height="900" fill="#f8fbff"/><text x="800" y="70" text-anchor="middle" class="t h">МИКРОДИАЛОГ МЕНЯЕТ УСЛОВНОЕ РАСПРЕДЕЛЕНИЕ</text><text x="800" y="110" text-anchor="middle" class="t s">Весы LLM остаются прежними; изменяется контекст предсказания.</text>
