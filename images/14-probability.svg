<text x="1225" y="280" class="t c">формальнее</text><text x="1225" y="438" class="t c">дружелюбнее</text><text x="1225" y="730" class="t c">короче и жёстче</text><rect x="235" y="790" width="1130" height="70" rx="20" fill="#fff5e9"/><text x="800" y="834" text-anchor="middle" class="t s">Линии концептуальны: величина эффекта определяется экспериментом.</text></svg>
