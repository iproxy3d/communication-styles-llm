<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.m{font-family:Georgia,serif;fill:#17233b}.h{font-size:38px;font-weight:700}.b{font-size:27px;font-weight:700}.s{font-size:22px}.c{font-size:18px;fill:#5d687a}.card{fill:#fff;stroke:#dce3ee;stroke-width:2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e61c8"/></marker></defs><rect width="1600" height="900" fill="#f8fbff"/><text x="800" y="70" text-anchor="middle" class="t h">АССОЦИАТИВНАЯ ПАМЯТЬ: ФОРМУЛЫ ОБНОВЛЕНИЯ</text>
<rect x="80" y="160" width="440" height="230" rx="25" class="card"/><text x="300" y="215" text-anchor="middle" class="t b">1. Активация</text><text x="300" y="280" text-anchor="middle" class="m" font-size="38">Aₜ = Aggregate{A(xᵢ)}</text><text x="300" y="330" text-anchor="middle" class="t c">сущности текущего контекста</text><path d="M535 275h95" stroke="#6e61c8" stroke-width="5" marker-end="url(#a)"/>
<rect x="645" y="130" width="520" height="290" rx="25" fill="#f2edff" stroke="#806bd2" stroke-width="3"/><text x="905" y="190" text-anchor="middle" class="t b">2. Влияние на стиль</text><text x="905" y="270" text-anchor="middle" class="m" font-size="40">Sₜ = αUₜ + (1 − α)Eₜ + βAₜ</text><text x="905" y="330" text-anchor="middle" class="t c">β определяет силу влияния памяти</text><path d="M1180 275h95" stroke="#6e61c8" stroke-width="5" marker-end="url(#a)"/>
<rect x="1290" y="160" width="230" height="230" rx="25" class="card"/><text x="1405" y="220" text-anchor="middle" class="t b">Styleₜ</text><text x="1405" y="280" text-anchor="middle" class="t s">профиль</text><text x="1405" y="315" text-anchor="middle" class="t s">поведения</text>
<rect x="100" y="500" width="660" height="245" rx="25" fill="#eaf7ef" stroke="#4a9d76" stroke-width="3"/><text x="430" y="560" text-anchor="middle" class="t b">3. Постепенное обучение</text><text x="430" y="640" text-anchor="middle" class="m" font-size="39">Aₜ₊₁(x) = Aₜ(x) + η(Eₜ − Aₜ(x))</text><text x="430" y="695" text-anchor="middle" class="t c">малое η защищает память от единичного эпизода</text>
<rect x="840" y="500" width="660" height="245" rx="25" fill="#fff4df" stroke="#d79a42" stroke-width="3"/><text x="1170" y="560" text-anchor="middle" class="t b">4. Забывание</text><text x="1170" y="640" text-anchor="middle" class="m" font-size="39">A ← γA, &#160; 0 &lt; γ &lt; 1</text><text x="1170" y="695" text-anchor="middle" class="t c">давний опыт постепенно теряет влияние</text>
<rect x="270" y="805" width="1060" height="60" rx="18" fill="#edf4ff"/><text x="800" y="844" text-anchor="middle" class="t s">Тип вектора — probabilities, logits или signed biases — определяет нормализацию.</text></svg>
