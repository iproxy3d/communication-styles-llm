<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:44px;font-weight:700}.b{font-size:25px;font-weight:700}.s{font-size:21px}.c{font-size:17px;fill:#5d687a}.card{fill:#fff;stroke:#dce3ee;stroke-width:2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#507dbb"/></marker></defs><rect width="1600" height="900" fill="#f8fbff"/><text x="800" y="70" text-anchor="middle" class="t h">КАК ФОРМИРУЕТСЯ Aₜ ПРИ НЕСКОЛЬКИХ СУЩНОСТЯХ</text><text x="800" y="110" text-anchor="middle" class="t s">Конкретный агрегатор G остаётся отдельным инженерным решением.</text>
<g><rect x="40" y="245" width="250" height="310" rx="24" class="card"/><text x="165" y="300" text-anchor="middle" class="t b">1. Сообщение</text><text x="80" y="380" class="t s">«Я вчера встретил</text><text x="80" y="415" class="t s">Ивана в аэропорту»</text></g><path d="M305 400h75" stroke="#507dbb" stroke-width="5" marker-end="url(#a)"/>
<g><rect x="395" y="245" width="250" height="310" rx="24" fill="#eaf7ef" stroke="#5ca27f" stroke-width="2"/><text x="520" y="300" text-anchor="middle" class="t b">2. NER</text><rect x="435" y="355" width="170" height="52" rx="13" fill="#fff"/><text x="520" y="388" text-anchor="middle" class="t s">Иван</text><rect x="435" y="430" width="170" height="52" rx="13" fill="#fff"/><text x="520" y="463" text-anchor="middle" class="t s">аэропорт</text></g><path d="M660 400h75" stroke="#507dbb" stroke-width="5" marker-end="url(#a)"/>
<g><rect x="750" y="245" width="250" height="310" rx="24" fill="#f3efff" stroke="#806bd2" stroke-width="2"/><text x="875" y="300" text-anchor="middle" class="t b">3. Поиск</text><text x="790" y="375" class="t s">A(Иван)</text><text x="790" y="425" class="t s">A(аэропорт)</text><text x="875" y="500" text-anchor="middle" class="t c">векторы из памяти</text></g><path d="M1015 400h75" stroke="#507dbb" stroke-width="5" marker-end="url(#a)"/>
<g><rect x="1105" y="245" width="200" height="310" rx="24" fill="#fff4df" stroke="#d79a42" stroke-width="2"/><text x="1205" y="300" text-anchor="middle" class="t b">4. G</text><text x="1205" y="390" text-anchor="middle" class="t s">взвешивание</text><text x="1205" y="430" text-anchor="middle" class="t s">и агрегация</text><text x="1205" y="490" text-anchor="middle" class="t c">контекст важен</text></g><path d="M1320 400h75" stroke="#507dbb" stroke-width="5" marker-end="url(#a)"/>
<g><rect x="1410" y="245" width="150" height="310" rx="24" fill="#edf4ff" stroke="#507dbb" stroke-width="2"/><text x="1485" y="300" text-anchor="middle" class="t b">5. Aₜ</text><rect x="1450" y="350" width="18" height="130" rx="9" fill="#6388c6"/><rect x="1480" y="390" width="18" height="90" rx="9" fill="#8b72d7"/><rect x="1510" y="420" width="18" height="60" rx="9" fill="#d99a41"/></g>
<rect x="180" y="675" width="1240" height="140" rx="24" fill="#fff5e9"/><text x="800" y="722" text-anchor="middle" class="t b">Возможные G: weighted mean · max · attention · контекстный селектор</text><text x="800" y="765" text-anchor="middle" class="t s">A(самолёт, отпуск) и A(самолёт, катастрофа) не обязаны совпадать.</text></svg>
