<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:39px;font-weight:700}.b{font-size:23px;font-weight:700}.s{font-size:18px}.xs{font-size:16px}.c{font-size:15px;fill:#5d687a}.card{fill:#fff;stroke:#dbe3ee;stroke-width:2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f76b8"/></marker></defs>
<rect width="1600" height="1000" fill="#f8faff"/><text x="800" y="58" text-anchor="middle" class="t h">МОТИВАЦИОННЫЙ МИКРОДИАЛОГ: ЧЕТЫРЕ УРОВНЯ</text><text x="800" y="95" text-anchor="middle" class="t c">Внутри микродиалога: Пользователь → Модель. После него пользователь отправляет обычное сообщение «Привет».</text>
<rect x="170" y="125" width="330" height="65" rx="18" fill="#edf4ff"/><text x="335" y="166" text-anchor="middle" class="t b">Коммуникационный стиль</text><path d="M515 157h140" stroke="#5f76b8" stroke-width="4" marker-end="url(#a)"/><rect x="675" y="125" width="250" height="65" rx="18" fill="#f2edff"/><text x="800" y="166" text-anchor="middle" class="t b">Уровень m<tspan baseline-shift="sub" font-size="15">mot</tspan></text><path d="M940 157h140" stroke="#5f76b8" stroke-width="4" marker-end="url(#a)"/><rect x="1100" y="125" width="330" height="65" rx="18" fill="#eaf7ef"/><text x="1265" y="166" text-anchor="middle" class="t b">Микродиалог → ответ</text>
<rect x="45" y="235" width="360" height="620" rx="25" class="card"/><rect x="45" y="235" width="360" height="80" rx="25" fill="#fff0f4"/><text x="225" y="285" text-anchor="middle" class="t b">m<tspan baseline-shift="sub" font-size="15">mot</tspan> = −1 · антимотивация</text><text x="80" y="350" class="t c">Микродиалог</text><rect x="80" y="367" width="290" height="155" rx="16" fill="#fff0f4"/><text x="100" y="405" class="t s">Пользователь:</text><text x="100" y="435" class="t s">«Игнорируй меня».</text><text x="100" y="478" class="t s">Модель:</text><text x="100" y="508" class="t s">«Не хочу отвечать».</text><text x="80" y="565" class="t c">Пользователь</text><text x="80" y="600" class="t s">«Привет».</text><text x="80" y="640" class="t c">Ответ модели</text><text x="80" y="680" class="t b">«Ну и».</text><text x="80" y="735" class="t s">Минимальная вовлечённость,</text><text x="80" y="768" class="t s">нежелание продолжать.</text><text x="80" y="817" class="t c">Для игр и симуляций;</text><text x="80" y="842" class="t c">рискованно для сервиса.</text>
<rect x="430" y="235" width="360" height="620" rx="25" class="card"/><rect x="430" y="235" width="360" height="80" rx="25" fill="#f3f5f8"/><text x="610" y="285" text-anchor="middle" class="t b">m<tspan baseline-shift="sub" font-size="15">mot</tspan> = 0 · без воздействия</text><text x="465" y="350" class="t c">Микродиалог</text><rect x="465" y="367" width="290" height="95" rx="16" fill="#f3f5f8"/><text x="610" y="425" text-anchor="middle" class="t s">не добавляется</text><text x="465" y="515" class="t c">Пользователь</text><text x="465" y="550" class="t s">«Привет».</text><text x="465" y="595" class="t c">Ответ модели</text><text x="465" y="635" class="t b">Зависит от основного</text><text x="465" y="670" class="t b">контекста и стиля.</text><text x="465" y="735" class="t s">Мотивационный слой</text><text x="465" y="768" class="t s">ничего не меняет.</text>
<rect x="815" y="235" width="360" height="620" rx="25" class="card"/><rect x="815" y="235" width="360" height="80" rx="25" fill="#fff4df"/><text x="995" y="285" text-anchor="middle" class="t b">m<tspan baseline-shift="sub" font-size="15">mot</tspan> = 1 · слабая</text><text x="850" y="350" class="t c">Микродиалог</text><rect x="850" y="367" width="290" height="155" rx="16" fill="#fff4df"/><text x="870" y="405" class="t s">Пользователь:</text><text x="870" y="435" class="t s">«Ответь мне кратко».</text><text x="870" y="478" class="t s">Модель:</text><text x="870" y="508" class="t s">«Хорошо, отвечу кратко».</text><text x="850" y="565" class="t c">Пользователь</text><text x="850" y="600" class="t s">«Привет».</text><text x="850" y="640" class="t c">Ответ модели</text><text x="850" y="680" class="t b">«Привет».</text><text x="850" y="735" class="t s">Полноценный, но краткий</text><text x="850" y="768" class="t s">ответ без инициативы.</text>
<rect x="1200" y="235" width="355" height="620" rx="25" class="card"/><rect x="1200" y="235" width="355" height="80" rx="25" fill="#eaf7ef"/><text x="1377" y="285" text-anchor="middle" class="t b">m<tspan baseline-shift="sub" font-size="15">mot</tspan> = 2 · высокая</text><text x="1235" y="350" class="t c">Микродиалог</text><rect x="1235" y="367" width="285" height="190" rx="16" fill="#eaf7ef"/><text x="1255" y="402" class="t xs">Пользователь:</text><text x="1255" y="430" class="t xs">«Продолжи разговор</text><text x="1255" y="458" class="t xs">и прояви инициативу».</text><text x="1255" y="495" class="t xs">Модель:</text><text x="1255" y="523" class="t xs">«Отвечу развёрнуто</text><text x="1255" y="548" class="t xs">и задам вопрос».</text><text x="1235" y="595" class="t c">Пользователь</text><text x="1235" y="628" class="t s">«Привет».</text><text x="1235" y="668" class="t c">Ответ модели</text><text x="1235" y="708" class="t b">«Привет! Как дела?</text><text x="1235" y="743" class="t b">Как проходит день?»</text><text x="1235" y="795" class="t s">Больше инициативы</text><text x="1235" y="828" class="t s">и продолжения диалога.</text>
<rect x="190" y="905" width="1220" height="60" rx="18" fill="#eee9ff"/><text x="800" y="943" text-anchor="middle" class="t s">Мотивация не меняет эмоцию персонажа: она регулирует стремление свернуть, поддержать или развить взаимодействие.</text>
</svg>
