<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:700}.sh{font-size:25px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:18px}.xs{font-size:15px}.muted{fill:#647086}.box{fill:#fff;stroke:#d8e0eb;stroke-width:2}.dash{stroke:#8a78cc;stroke-width:3;stroke-dasharray:10 9;fill:none}.arr{stroke:#667dc1;stroke-width:4;fill:none}</style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667dc1"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#faf9ff"/>
  <text x="800" y="54" text-anchor="middle" class="t h">СОСТОЯНИЕ ПРЕДЛАГАЕТ РЕАКЦИЮ, КОНТРОЛЬ ЗАДАЁТ ФОРМУ</text>
  <text x="800" y="91" text-anchor="middle" class="t s muted">Функциональная аналогия управления поведением — не схема устройства мозга и не утверждение, что LLM устроена как человек.</text>

  <rect x="155" y="122" width="1290" height="78" rx="20" fill="#eee9ff"/>
  <text x="800" y="153" text-anchor="middle" class="t b">Почему аналогия не случайна</text>
  <text x="800" y="181" text-anchor="middle" class="t s">Тексты сохраняют наблюдаемые следы эмоций, памяти, социального контекста, планирования и речевого контроля.</text>

  <text x="410" y="252" text-anchor="middle" class="t sh">Человек: взаимодействующие сети</text>
  <text x="1190" y="252" text-anchor="middle" class="t sh">Агент: вычислительная модель</text>

  <rect x="70" y="285" width="680" height="125" rx="22" fill="#fff0f4" stroke="#cc6b8a" stroke-width="3"/>
  <text x="410" y="325" text-anchor="middle" class="t b">Аффективные и сигнальные системы</text>
  <text x="410" y="356" text-anchor="middle" class="t s">оценивают значимость ситуации и формируют</text>
  <text x="410" y="384" text-anchor="middle" class="t s">текущий эмоциональный фон</text>

  <rect x="850" y="285" width="680" height="125" rx="22" fill="#fff0f4" stroke="#cc6b8a" stroke-width="3"/>
  <text x="1190" y="325" text-anchor="middle" class="t b">Коммуникационное состояние Sₜ</text>
  <text x="1190" y="356" text-anchor="middle" class="t s">собеседник + состояние агента + ассоциации</text>
  <text x="1190" y="384" text-anchor="middle" class="t s">дают текущий аффективный сигнал</text>
  <path d="M750 347h100" class="dash"/>

  <path d="M410 425v45" class="arr" marker-end="url(#a)"/><path d="M1190 425v45" class="arr" marker-end="url(#a)"/>

  <rect x="70" y="485" width="680" height="145" rx="22" fill="#eef5ff" stroke="#5681bd" stroke-width="3"/>
  <text x="410" y="525" text-anchor="middle" class="t b">Оценка, память, планирование и контроль</text>
  <text x="410" y="557" text-anchor="middle" class="t s">опыт, цели и социальные нормы ограничивают</text>
  <text x="410" y="585" text-anchor="middle" class="t s">возможные способы реакции</text>
  <text x="410" y="608" text-anchor="middle" class="t xs muted">Дофамин и стрессовые гормоны могут менять работу сетей,</text>
  <text x="410" y="625" text-anchor="middle" class="t xs muted">но не являются простым переключателем.</text>

  <rect x="850" y="485" width="680" height="145" rx="22" fill="#eef5ff" stroke="#5681bd" stroke-width="3"/>
  <text x="1190" y="525" text-anchor="middle" class="t b">Веса характера W<tspan baseline-shift="sub" font-size="14">character</tspan></text>
  <text x="1190" y="557" text-anchor="middle" class="t s">усиливают, ослабляют или запрещают реакции</text>
  <text x="1190" y="585" text-anchor="middle" class="t s">и определяют доступное эмоциональное поле</text>
  <text x="1190" y="612" text-anchor="middle" class="t xs muted">Это устойчивый поведенческий фильтр, а не модель лобной доли.</text>
  <path d="M750 557h100" class="dash"/>

  <path d="M410 645v45" class="arr" marker-end="url(#a)"/><path d="M1190 645v45" class="arr" marker-end="url(#a)"/>

  <rect x="70" y="705" width="680" height="135" rx="22" fill="#eaf7ef" stroke="#3d9b68" stroke-width="3"/>
  <text x="410" y="747" text-anchor="middle" class="t b">Выраженная речь и поведение</text>
  <text x="410" y="779" text-anchor="middle" class="t s">эмоция не равна готовой фразе:</text>
  <text x="410" y="807" text-anchor="middle" class="t s">её выражение зависит от контекста и контроля</text>

  <rect x="850" y="705" width="680" height="135" rx="22" fill="#eaf7ef" stroke="#3d9b68" stroke-width="3"/>
  <text x="1190" y="747" text-anchor="middle" class="t b">Микродиалог → сообщение → ответ</text>
  <text x="1190" y="779" text-anchor="middle" class="t s">микродиалог показывает локальный образец</text>
  <text x="1190" y="807" text-anchor="middle" class="t s">того, как выразить выбранную реакцию</text>
  <path d="M750 772h100" class="dash"/>

  <rect x="170" y="885" width="1260" height="72" rx="20" fill="#eee9ff"/>
  <text x="800" y="914" text-anchor="middle" class="t b">Пунктир означает сходство функций, а не соответствие анатомических структур.</text>
  <text x="800" y="942" text-anchor="middle" class="t s">Микродиалог — внешний локальный образец текста, а не биологическое внимание и не attention-слой трансформера.</text>
</svg>
