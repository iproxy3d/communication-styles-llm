<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:42px;font-weight:700}.b{font-size:24px;font-weight:700}.s{font-size:20px}.c{font-size:17px;fill:#5c687b}.role{font-size:16px;font-weight:700}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e61c8"/></marker></defs><rect width="1600" height="900" fill="#f8f9fd"/><text x="800" y="65" text-anchor="middle" class="t h">ЧТО ИМЕННО ПОЛУЧАЕТ LLM ПЕРЕД ГЕНЕРАЦИЕЙ</text><text x="800" y="105" text-anchor="middle" class="t c">Один буквальный пример сборки контекста. Служебные метки показаны для объяснения и пользователю не выводятся.</text>
<rect x="70" y="155" width="1030" height="115" rx="20" fill="#edf4ff" stroke="#6b8fc7" stroke-width="2"/><text x="105" y="190" class="t role" fill="#315e9d">SYSTEM · ПОСТОЯННО</text><text x="105" y="230" class="t s">Ты сотрудник аэропорта. Сообщай только подтверждённые данные и предлагай следующий шаг.</text>
<rect x="70" y="290" width="1030" height="115" rx="20" fill="#fff" stroke="#d9e0eb" stroke-width="2"/><text x="105" y="325" class="t role">HISTORY · РЕАЛЬНЫЙ ДИАЛОГ</text><text x="105" y="365" class="t s">AI: «На рейс 417 мест нет».  User: «Но мне нужно улететь сегодня».</text>
<rect x="70" y="425" width="1030" height="180" rx="20" fill="#fff0f5" stroke="#d4648d" stroke-width="3"/><text x="105" y="462" class="t role" fill="#b73566">MICRODIALOG · СКРЫТАЯ ДИНАМИЧЕСКАЯ ВСТАВКА</text><text x="105" y="505" class="t s">User: «Я очень раздражён этой ситуацией».</text><text x="105" y="548" class="t s">AI: «Понимаю раздражение. Давайте без резкости и найдём решение».</text><text x="105" y="582" class="t c">Абстрактная ситуация: она задаёт манеру, но не добавляет фактов о рейсе.</text>
<rect x="70" y="625" width="1030" height="115" rx="20" fill="#eef8f6" stroke="#55a18e" stroke-width="3"/><text x="105" y="660" class="t role" fill="#087b79">USER · ТЕКУЩЕЕ РЕАЛЬНОЕ СООБЩЕНИЕ</text><text x="105" y="704" class="t s">«Тупица. Найди мне другой рейс».</text>
<path d="M1120 445h110" stroke="#6e61c8" stroke-width="5" marker-end="url(#a)"/><rect x="1250" y="275" width="285" height="330" rx="28" fill="#fff" stroke="#6e61c8" stroke-width="3"/><text x="1392" y="335" text-anchor="middle" class="t b">LLM</text><text x="1392" y="390" text-anchor="middle" class="t s">генерирует только</text><text x="1392" y="425" text-anchor="middle" class="t s">следующую реплику</text><text x="1392" y="495" text-anchor="middle" class="t c">веса модели</text><text x="1392" y="525" text-anchor="middle" class="t c">не меняются</text><path d="M1392 620v70" stroke="#6e61c8" stroke-width="5" marker-end="url(#a)"/><rect x="1130" y="710" width="405" height="125" rx="20" fill="#eaf7ef" stroke="#4b9d76" stroke-width="3"/><text x="1165" y="750" class="t role" fill="#28714e">ASSISTANT · ВИДИТ ПОЛЬЗОВАТЕЛЬ</text><text x="1165" y="790" class="t s">«Я помогу, но давайте без</text><text x="1165" y="822" class="t s">оскорблений. Проверю варианты».</text></svg>
