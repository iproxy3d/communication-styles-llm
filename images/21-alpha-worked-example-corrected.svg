<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:42px;font-weight:700}.b{font-size:25px;font-weight:700}.s{font-size:19px}.c{font-size:17px;fill:#5d687a}.card{fill:#fff;stroke:#dbe3ee;stroke-width:2}</style></defs><rect width="1600" height="900" fill="#f7faff"/><text x="800" y="65" text-anchor="middle" class="t h">ОДНА СИТУАЦИЯ, ТРИ ЗНАЧЕНИЯ α</text><text x="800" y="105" text-anchor="middle" class="t c">Иллюстрация по одной координате «раздражение»: U = 0,80; E = 0,10; S = αU + (1−α)E.</text>
<rect x="70" y="145" width="1460" height="85" rx="20" fill="#edf4ff"/><text x="110" y="180" class="t b">Вход Xₜ для анализа:</text><text x="390" y="180" class="t s">«Тупица. Найди мне другой рейс».</text><text x="110" y="215" class="t c">Xₜ ещё не помещён в LLM-контекст: сначала выбирается скрытая пара, затем добавляется REAL USER Xₜ.</text>
<rect x="70" y="270" width="455" height="520" rx="25" class="card"/><text x="297" y="325" text-anchor="middle" class="t b">α = 0,20 · устойчивый</text><text x="297" y="365" text-anchor="middle" class="t s">S = 0,24</text><text x="105" y="415" class="t c">Выбранный микродиалог</text><rect x="105" y="435" width="385" height="125" rx="16" fill="#eef8f6"/><text x="130" y="473" class="t tiny">HIDDEN USER: «Я недоволен».</text><text x="130" y="510" class="t tiny">HIDDEN AI: «Давайте спокойно</text><text x="130" y="538" class="t tiny">найдём решение».</text><text x="105" y="595" class="t b">→ REAL USER Xₜ → LLM</text><text x="105" y="630" class="t c">Получаемый ответ</text><text x="105" y="673" class="t s">«Проверю другие рейсы.</text><text x="105" y="705" class="t s">Уточните допустимое время».</text><text x="105" y="755" class="t c">Агент почти не перенимает тон.</text>
<rect x="572" y="270" width="455" height="520" rx="25" class="card"/><text x="799" y="325" text-anchor="middle" class="t b">α = 0,50 · баланс</text><text x="799" y="365" text-anchor="middle" class="t s">S = 0,45</text><text x="607" y="415" class="t c">Выбранный микродиалог</text><rect x="607" y="435" width="385" height="125" rx="16" fill="#fff4df"/><text x="632" y="473" class="t tiny">HIDDEN USER: «Это раздражает».</text><text x="632" y="510" class="t tiny">HIDDEN AI: «Понимаю. Продолжим</text><text x="632" y="538" class="t tiny">без резкости».</text><text x="607" y="595" class="t b">→ REAL USER Xₜ → LLM</text><text x="607" y="630" class="t c">Получаемый ответ</text><text x="607" y="673" class="t s">«Понимаю ваше раздражение.</text><text x="607" y="705" class="t s">Давайте без оскорблений».</text><text x="607" y="755" class="t c">Эмоция признана, характер сохранён.</text>
<rect x="1074" y="270" width="455" height="520" rx="25" class="card"/><text x="1301" y="325" text-anchor="middle" class="t b">α = 0,80 · реактивный</text><text x="1301" y="365" text-anchor="middle" class="t s">S = 0,66</text><text x="1109" y="415" class="t c">Выбранный микродиалог</text><rect x="1109" y="435" width="385" height="125" rx="16" fill="#fff0f4"/><text x="1134" y="473" class="t tiny">HIDDEN USER: «Меня провоцируют».</text><text x="1134" y="510" class="t tiny">HIDDEN AI: «Стоп. Так со мной</text><text x="1134" y="538" class="t tiny">говорить не нужно».</text><text x="1109" y="595" class="t b">→ REAL USER Xₜ → LLM</text><text x="1109" y="630" class="t c">Получаемый ответ</text><text x="1109" y="673" class="t s">«Я помогу, но оскорбления</text><text x="1109" y="705" class="t s">неприемлемы».</text><text x="1109" y="755" class="t c">Текущий сигнал влияет сильнее.</text><text x="800" y="850" text-anchor="middle" class="t c">Пример порогов: S &lt; 0,35 — слабая реакция; 0,35–0,55 — умеренная; S &gt; 0,55 — выраженная. Реальные пороги калибруются.</text></svg>
