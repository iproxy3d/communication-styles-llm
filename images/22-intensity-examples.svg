<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:42px;font-weight:700}.b{font-size:25px;font-weight:700}.s{font-size:19px}.c{font-size:17px;fill:#5d687a}.card{fill:#fff;stroke:#dbe3ee;stroke-width:2}</style></defs><rect width="1600" height="900" fill="#f8fbff"/><text x="800" y="65" text-anchor="middle" class="t h">ИНТЕНСИВНОСТЬ: ЧТО МЕНЯЕТСЯ В САМОЙ ВСТАВКЕ</text><text x="800" y="105" text-anchor="middle" class="t c">Один реальный запрос: «Почему прогноз опять ошибся?» Персонаж: дружелюбный, слегка ироничный.</text>
<rect x="70" y="155" width="455" height="600" rx="25" class="card"/><text x="297" y="210" text-anchor="middle" class="t b">Уровень 0 · нейтрально</text><text x="105" y="270" class="t c">Скрытая вставка</text><rect x="105" y="292" width="385" height="100" rx="16" fill="#f3f5f8"/><text x="297" y="352" text-anchor="middle" class="t s">микродиалог отсутствует</text><text x="105" y="455" class="t c">Пример ответа</text><text x="105" y="500" class="t s">«Прогнозы строятся на данных</text><text x="105" y="533" class="t s">и могут меняться. Проверим</text><text x="105" y="566" class="t s">обновлённую информацию».</text><text x="105" y="680" class="t c">Содержание доминирует.</text>
<rect x="572" y="155" width="455" height="600" rx="25" class="card"/><text x="799" y="210" text-anchor="middle" class="t b">Уровень 1 · один блок</text><text x="607" y="270" class="t c">Скрытая вставка</text><rect x="607" y="292" width="385" height="140" rx="16" fill="#eef8f6"/><text x="632" y="333" class="t s">User: «Опять не получилось?».</text><text x="632" y="375" class="t s">AI: «Да уж. Давайте</text><text x="632" y="407" class="t s">посмотрим, что изменилось».</text><text x="607" y="475" class="t c">Пример ответа</text><text x="607" y="520" class="t s">«Да уж, погода снова решила</text><text x="607" y="553" class="t s">внести правки. Проверим</text><text x="607" y="586" class="t s">свежий прогноз».</text><text x="607" y="680" class="t c">Стиль заметен, факты сохранены.</text>
<rect x="1074" y="155" width="455" height="600" rx="25" class="card"/><text x="1301" y="210" text-anchor="middle" class="t b">Уровень 2 · два блока</text><text x="1109" y="270" class="t c">Скрытая вставка</text><rect x="1109" y="292" width="385" height="215" rx="16" fill="#fff0f4"/><text x="1134" y="330" class="t s">User: «Опять ошибка?».</text><text x="1134" y="366" class="t s">AI: «Ну конечно. Идеально».</text><text x="1134" y="412" class="t s">User: «Что теперь?».</text><text x="1134" y="448" class="t s">AI: «Спокойно. Разберёмся».</text><text x="1109" y="548" class="t c">Пример ответа</text><text x="1109" y="593" class="t s">«Ну конечно, атмосфера опять</text><text x="1109" y="626" class="t s">передумала. Давайте разберём</text><text x="1109" y="659" class="t s">обновления по шагам».</text><text x="1109" y="710" class="t c">Сильнее стиль, выше риск увода.</text><rect x="245" y="800" width="1110" height="60" rx="18" fill="#fff4df"/><text x="800" y="838" text-anchor="middle" class="t s">Длина — не единственный регулятор: важны лексика, выразительность, близость к запросу и конкретная LLM.</text></svg>
