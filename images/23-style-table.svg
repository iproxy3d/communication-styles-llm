<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:40px;font-weight:700}.b{font-size:23px;font-weight:700}.s{font-size:18px}.c{font-size:16px;fill:#5d687a}.cell{fill:#fff;stroke:#d9e2ec;stroke-width:2}</style></defs><rect width="1600" height="900" fill="#f7faff"/><text x="800" y="62" text-anchor="middle" class="t h">ТАБЛИЦА КОММУНИКАЦИОННЫХ СТИЛЕЙ</text><text x="800" y="100" text-anchor="middle" class="t c">Каждый стиль содержит строковые поля для распознаваемых эмоций; в поле записан соответствующий микродиалог.</text>
<rect x="55" y="145" width="240" height="95" rx="18" fill="#315e9d"/><text x="175" y="202" text-anchor="middle" class="t b" fill="#fff" style="fill:#fff">Стиль</text><rect x="315" y="145" width="295" height="95" rx="18" fill="#edf4ff"/><text x="462" y="202" text-anchor="middle" class="t b">Страх</text><rect x="630" y="145" width="295" height="95" rx="18" fill="#fff0f4"/><text x="777" y="202" text-anchor="middle" class="t b">Раздражение</text><rect x="945" y="145" width="295" height="95" rx="18" fill="#eef8f6"/><text x="1092" y="202" text-anchor="middle" class="t b">Радость</text><rect x="1260" y="145" width="285" height="95" rx="18" fill="#f3f5f8"/><text x="1402" y="202" text-anchor="middle" class="t b">Нейтрально</text>
<rect x="55" y="260" width="240" height="165" rx="18" fill="#eaf8f6" stroke="#5aa08f" stroke-width="2"/><text x="175" y="330" text-anchor="middle" class="t b">Дружеский</text><text x="175" y="370" text-anchor="middle" class="t c">неформально, тепло</text><rect x="315" y="260" width="295" height="165" rx="18" class="cell"/><text x="335" y="310" class="t s">«Эй, спокойно.</text><text x="335" y="345" class="t s">Я рядом».</text><rect x="630" y="260" width="295" height="165" rx="18" class="cell"/><text x="650" y="310" class="t s">«Да уж. Давай</text><text x="650" y="345" class="t s">без этого».</text><rect x="945" y="260" width="295" height="165" rx="18" class="cell"/><text x="965" y="310" class="t s">«Вот это отлично!</text><text x="965" y="345" class="t s">Продолжим?»</text><rect x="1260" y="260" width="285" height="165" rx="18" class="cell"/><text x="1280" y="310" class="t s">пустая строка</text><text x="1280" y="345" class="t c">или базовый пример</text>
<rect x="55" y="445" width="240" height="165" rx="18" fill="#edf4ff" stroke="#6086be" stroke-width="2"/><text x="175" y="515" text-anchor="middle" class="t b">Формальный</text><text x="175" y="555" text-anchor="middle" class="t c">сдержанно, точно</text><rect x="315" y="445" width="295" height="165" rx="18" class="cell"/><text x="335" y="495" class="t s">«Понимаю тревогу.</text><text x="335" y="530" class="t s">Проверим факты».</text><rect x="630" y="445" width="295" height="165" rx="18" class="cell"/><text x="650" y="495" class="t s">«Прошу сохранять</text><text x="650" y="530" class="t s">корректный тон».</text><rect x="945" y="445" width="295" height="165" rx="18" class="cell"/><text x="965" y="495" class="t s">«Это хороший</text><text x="965" y="530" class="t s">результат».</text><rect x="1260" y="445" width="285" height="165" rx="18" class="cell"/><text x="1280" y="495" class="t s">пустая строка</text><text x="1280" y="530" class="t c">без локального сигнала</text>
<rect x="55" y="630" width="240" height="165" rx="18" fill="#fff4df" stroke="#d59b43" stroke-width="2"/><text x="175" y="700" text-anchor="middle" class="t b">Ироничный</text><text x="175" y="740" text-anchor="middle" class="t c">мягкая ирония</text><rect x="315" y="630" width="295" height="165" rx="18" class="cell"/><text x="335" y="680" class="t s">«Ну да, звучит</text><text x="335" y="715" class="t s">обнадёживающе...»</text><rect x="630" y="630" width="295" height="165" rx="18" class="cell"/><text x="650" y="680" class="t s">«Прекрасно.</text><text x="650" y="715" class="t s">Опять сначала».</text><rect x="945" y="630" width="295" height="165" rx="18" class="cell"/><text x="965" y="680" class="t s">«Редкий случай —</text><text x="965" y="715" class="t s">всё получилось».</text><rect x="1260" y="630" width="285" height="165" rx="18" class="cell"/><text x="1280" y="680" class="t s">пустая строка</text><text x="1280" y="715" class="t c">нейтральный режим</text><rect x="260" y="830" width="1080" height="48" rx="15" fill="#eee9ff"/><text x="800" y="861" text-anchor="middle" class="t s">Выбор ячейки = выбранный стиль персонажа × эмоциональное состояние для текущего ответа.</text></svg>
