<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:40px;font-weight:700}.b{font-size:24px;font-weight:700}.s{font-size:19px}.c{font-size:16px;fill:#5d687a}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c72b6"/></marker></defs><rect width="1600" height="900" fill="#f8faff"/><text x="800" y="62" text-anchor="middle" class="t h">ВЫБОР И ВСТАВКА МИКРОДИАЛОГА НА ОДНОМ ШАГЕ</text><text x="800" y="100" text-anchor="middle" class="t c">Это один возможный способ реализации: таблица остаётся библиотекой, а селектор решает, какую ячейку использовать сейчас.</text>
<rect x="55" y="175" width="280" height="245" rx="24" fill="#fff0f4" stroke="#cf688b" stroke-width="3"/><text x="195" y="230" text-anchor="middle" class="t b">Сигналы</text><text x="90" y="285" class="t s">Uₜ — собеседник</text><text x="90" y="325" class="t s">Eₜ — состояние агента</text><text x="90" y="365" class="t s">Aₜ — ассоциации</text><path d="M350 298h100" stroke="#5c72b6" stroke-width="5" marker-end="url(#a)"/>
<rect x="470" y="190" width="280" height="215" rx="24" fill="#fff4df" stroke="#d69b43" stroke-width="3"/><text x="610" y="250" text-anchor="middle" class="t b">Состояние Sₜ</text><text x="610" y="305" text-anchor="middle" class="t s">полный вектор</text><text x="610" y="345" text-anchor="middle" class="t c">реактивность регулирует α</text><path d="M765 298h100" stroke="#5c72b6" stroke-width="5" marker-end="url(#a)"/>
<rect x="885" y="150" width="310" height="295" rx="24" fill="#edf4ff" stroke="#557fbb" stroke-width="3"/><text x="1040" y="210" text-anchor="middle" class="t b">Селектор</text><text x="920" y="265" class="t s">1. получить профиль стиля</text><text x="920" y="305" class="t s">2. применить policy к Sₜ</text><text x="920" y="345" class="t s">3. выбрать поле и вариант</text><text x="920" y="385" class="t s">4. задать число пар k</text><path d="M1210 298h100" stroke="#5c72b6" stroke-width="5" marker-end="url(#a)"/>
<rect x="1330" y="175" width="215" height="245" rx="24" fill="#f2edff" stroke="#7862c5" stroke-width="3"/><text x="1437" y="230" text-anchor="middle" class="t b">Ячейка</text><text x="1437" y="285" text-anchor="middle" class="t s">style × emotion → USER → AI</text><text x="1437" y="335" text-anchor="middle" class="t c">строковый текст</text><text x="1437" y="370" text-anchor="middle" class="t c">микродиалога</text><path d="M1437 435v90" stroke="#5c72b6" stroke-width="5" marker-end="url(#a)"/>
<rect x="180" y="555" width="1240" height="135" rx="25" fill="#fff" stroke="#d9e2ec" stroke-width="3"/><text x="800" y="605" text-anchor="middle" class="t b">Реальная история + выбранный микродиалог + текущее сообщение пользователя</text><text x="800" y="650" text-anchor="middle" class="t c">Если состояние нейтральное или поле пустое, вставка может отсутствовать.</text><path d="M800 705v65" stroke="#5c72b6" stroke-width="5" marker-end="url(#a)"/><rect x="500" y="790" width="600" height="75" rx="20" fill="#eaf7ef" stroke="#4a9d76" stroke-width="3"/><text x="800" y="838" text-anchor="middle" class="t b">LLM генерирует ответ в выбранной манере</text></svg>
