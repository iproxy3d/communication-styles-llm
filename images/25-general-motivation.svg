<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:42px;font-weight:700}.b{font-size:28px;font-weight:700}.s{font-size:22px}.c{font-size:18px;fill:#5d687a}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5674b9"/></marker></defs>
<rect width="1600" height="760" fill="#f8faff"/><text x="800" y="68" text-anchor="middle" class="t h">ИЗ ЧЕГО СКЛАДЫВАЕТСЯ ПОВЕДЕНИЕ ПЕРСОНАЖА</text>
<rect x="70" y="155" width="420" height="250" rx="28" fill="#fff0f4" stroke="#cf688b" stroke-width="3"/><text x="280" y="215" text-anchor="middle" class="t b">1. ЭМОЦИЯ</text><text x="280" y="265" text-anchor="middle" class="t s">Что он чувствует?</text><text x="280" y="325" text-anchor="middle" class="t c">спокоен · раздражён</text><text x="280" y="360" text-anchor="middle" class="t c">боится · радуется</text>
<path d="M510 280h90" stroke="#5674b9" stroke-width="5" marker-end="url(#a)"/>
<rect x="620" y="155" width="420" height="250" rx="28" fill="#edf4ff" stroke="#5674b9" stroke-width="3"/><text x="830" y="215" text-anchor="middle" class="t b">2. КОММУНИКАЦИОННЫЙ СТИЛЬ</text><text x="830" y="265" text-anchor="middle" class="t s">Как он это выражает?</text><text x="830" y="325" text-anchor="middle" class="t c">дружелюбно · формально</text><text x="830" y="360" text-anchor="middle" class="t c">холодно · иронично</text>
<path d="M1060 280h90" stroke="#5674b9" stroke-width="5" marker-end="url(#a)"/>
<rect x="1170" y="155" width="360" height="250" rx="28" fill="#eef8f2" stroke="#4c9c72" stroke-width="3"/><text x="1350" y="215" text-anchor="middle" class="t b">3. МОТИВАЦИЯ</text><text x="1350" y="265" text-anchor="middle" class="t s">Насколько активно</text><text x="1350" y="298" text-anchor="middle" class="t s">он продолжает?</text><text x="1350" y="350" text-anchor="middle" class="t c">свернуть · ответить</text><text x="1350" y="380" text-anchor="middle" class="t c">поддержать · развить</text>
<rect x="180" y="485" width="1240" height="170" rx="30" fill="#fff" stroke="#d5ddea" stroke-width="3"/><text x="800" y="535" text-anchor="middle" class="t b">Один спокойный дружелюбный персонаж — три уровня активности</text><text x="390" y="600" text-anchor="middle" class="t s">«Привет»</text><text x="800" y="600" text-anchor="middle" class="t s">«Привет! Рад вас видеть»</text><text x="1200" y="585" text-anchor="middle" class="t s">«Привет! Рад вас видеть.</text><text x="1200" y="618" text-anchor="middle" class="t s">Чем могу помочь?»</text><text x="390" y="635" text-anchor="middle" class="t c">кратко</text><text x="800" y="635" text-anchor="middle" class="t c">полноценно</text><text x="1200" y="653" text-anchor="middle" class="t c">с инициативой</text>
</svg>
