<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
<defs><style>.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:42px;font-weight:700}.b{font-size:26px;font-weight:700}.s{font-size:21px}.c{font-size:17px;fill:#5d687a}</style></defs>
<rect width="1600" height="860" fill="#f8faff"/><text x="800" y="68" text-anchor="middle" class="t h">ОДИН ДРУЖЕЛЮБНЫЙ СТИЛЬ — РАЗНАЯ ИНИЦИАТИВНОСТЬ</text><text x="800" y="108" text-anchor="middle" class="t c">Запрос пользователя во всех примерах: «Привет»</text>
<rect x="55" y="165" width="350" height="470" rx="28" fill="#fff0f4" stroke="#cf688b" stroke-width="3"/><text x="230" y="218" text-anchor="middle" class="t b">−1 · СВЕРНУТЬ</text><text x="230" y="265" text-anchor="middle" class="t c">Продуктовая настройка</text><text x="230" y="305" text-anchor="middle" class="t s">пара «свернуть»</text><rect x="90" y="355" width="280" height="105" rx="18" fill="#fff"/><text x="230" y="415" text-anchor="middle" class="t b">«Ну и»</text><text x="230" y="510" text-anchor="middle" class="t s">Тренажёры, игры,</text><text x="230" y="545" text-anchor="middle" class="t s">сложные персонажи</text><text x="230" y="595" text-anchor="middle" class="t c">Не для обычного сервиса</text>
<rect x="435" y="165" width="350" height="470" rx="28" fill="#f2f4f8" stroke="#9ba7b8" stroke-width="3"/><text x="610" y="218" text-anchor="middle" class="t b">0 · НЕ ВЛИЯТЬ</text><text x="610" y="265" text-anchor="middle" class="t c">Мотивационный микродиалог</text><text x="610" y="305" text-anchor="middle" class="t s">не добавляется</text><rect x="470" y="355" width="280" height="105" rx="18" fill="#fff"/><text x="610" y="415" text-anchor="middle" class="t b">Ответ по контексту</text><text x="610" y="510" text-anchor="middle" class="t s">Базовое поведение</text><text x="610" y="545" text-anchor="middle" class="t s">продукта</text>
<rect x="815" y="165" width="350" height="470" rx="28" fill="#fff5df" stroke="#d99a3b" stroke-width="3"/><text x="990" y="218" text-anchor="middle" class="t b">1 · ОТВЕТИТЬ</text><text x="990" y="265" text-anchor="middle" class="t c">Продуктовая настройка</text><text x="990" y="305" text-anchor="middle" class="t s">пара «кратко»</text><rect x="850" y="355" width="280" height="105" rx="18" fill="#fff"/><text x="990" y="415" text-anchor="middle" class="t b">«Привет»</text><text x="990" y="510" text-anchor="middle" class="t s">Справки, терминалы,</text><text x="990" y="545" text-anchor="middle" class="t s">короткие операции</text>
<rect x="1195" y="165" width="350" height="470" rx="28" fill="#eaf7f0" stroke="#4c9c72" stroke-width="3"/><text x="1370" y="218" text-anchor="middle" class="t b">2 · РАЗВИТЬ</text><text x="1370" y="265" text-anchor="middle" class="t c">Продуктовая настройка</text><text x="1370" y="305" text-anchor="middle" class="t s">пара «развить»</text><rect x="1230" y="355" width="280" height="105" rx="18" fill="#fff"/><text x="1370" y="395" text-anchor="middle" class="t b">«Привет! Как дела?</text><text x="1370" y="430" text-anchor="middle" class="t b">Чем помочь?»</text><text x="1370" y="510" text-anchor="middle" class="t s">Продажи, поддержка,</text><text x="1370" y="545" text-anchor="middle" class="t s">companion-агенты</text>
<rect x="155" y="700" width="1290" height="92" rx="24" fill="#edf4ff"/><text x="800" y="742" text-anchor="middle" class="t b">Менеджер выбирает желаемую активность, не меняя характер и бизнес-факты</text><text x="800" y="777" text-anchor="middle" class="t c">Конкретная LLM может формулировать ответ иначе; уровни нужно проверять на целевых сценариях.</text>
</svg>
