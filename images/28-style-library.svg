<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:18px}.b{font-size:19px;font-weight:700}.m{font-size:16px}.head{fill:#315e9d}.box{fill:#fff;stroke:#ccd7e6;stroke-width:2}.soft{fill:#edf4ff}.user{fill:#eef8f7}.ai{fill:#f3efff}.arrow{stroke:#66758a;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#66758a"/></marker></defs>
<rect width="1280" height="720" fill="#f8fafc"/><text x="50" y="52" class="h">Что хранит таблица коммуникационных стилей</text>
<rect x="50" y="88" width="1180" height="72" rx="12" class="soft"/><text x="75" y="118" class="b">Одна запись = один устойчивый стиль персонажа</text><text x="75" y="145" class="s">Каждое эмоциональное поле — строка или список строк с полным микродиалогом USER → AI.</text>
<rect x="50" y="190" width="1180" height="330" rx="12" class="box"/><rect x="50" y="190" width="1180" height="54" rx="12" class="head"/>
<text x="75" y="225" class="b" fill="white">Стиль</text><text x="255" y="225" class="b" fill="white">anger — злость</text><text x="585" y="225" class="b" fill="white">fear — страх</text><text x="915" y="225" class="b" fill="white">joy — радость</text>
<line x1="230" y1="190" x2="230" y2="520" stroke="#ccd7e6"/><line x1="560" y1="190" x2="560" y2="520" stroke="#ccd7e6"/><line x1="890" y1="190" x2="890" y2="520" stroke="#ccd7e6"/><line x1="50" y1="382" x2="1230" y2="382" stroke="#ccd7e6"/>
<text x="75" y="275" class="b">Дружеский</text><rect x="250" y="262" width="290" height="98" rx="10" class="ai"/><text x="266" y="290" class="m">USER: «Почему так резко?»</text><text x="266" y="320" class="m">AI: «Потому что это уже</text><text x="266" y="344" class="m">начинает раздражать».</text>
<rect x="580" y="262" width="290" height="98" rx="10" class="ai"/><text x="596" y="290" class="m">USER: «Ты волнуешься?»</text><text x="596" y="320" class="m">AI: «Немного. Давай всё</text><text x="596" y="344" class="m">проверим вместе».</text>
<rect x="910" y="262" width="290" height="98" rx="10" class="ai"/><text x="926" y="290" class="m">USER: «Ты рад?»</text><text x="926" y="320" class="m">AI: «Ещё бы! Это правда</text><text x="926" y="344" class="m">здорово».</text>
<text x="75" y="425" class="b">Формальный</text><rect x="250" y="405" width="290" height="92" rx="10" class="user"/><text x="266" y="433" class="m">USER: «Вас это сердит?»</text><text x="266" y="463" class="m">AI: «Ситуация вызывает</text><text x="266" y="487" class="m">обоснованное недовольство».</text>
<rect x="580" y="405" width="290" height="92" rx="10" class="user"/><text x="596" y="433" class="m">USER: «Есть риск?»</text><text x="596" y="463" class="m">AI: «Да. Предлагаю спокойно</text><text x="596" y="487" class="m">проверить детали».</text>
<rect x="910" y="405" width="290" height="92" rx="10" class="user"/><text x="926" y="433" class="m">USER: «Хорошая новость?»</text><text x="926" y="463" class="m">AI: «Да, результат можно</text><text x="926" y="487" class="m">считать положительным».</text>
<rect x="100" y="570" width="250" height="90" rx="12" class="ai"/><text x="120" y="600" class="b">Выбранная ячейка</text><text x="120" y="632" class="s">полный USER → AI</text><path d="M365 615 H520" class="arrow"/>
<rect x="535" y="570" width="250" height="90" rx="12" class="user"/><text x="555" y="600" class="b">Реальный USER</text><text x="555" y="632" class="s">текущее сообщение</text><path d="M800 615 H955" class="arrow"/>
<rect x="970" y="570" width="210" height="90" rx="12" class="soft"/><text x="990" y="600" class="b">LLM → ответ</text><text x="990" y="632" class="s">в выбранной манере</text>
</svg>
