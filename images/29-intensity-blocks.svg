<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700"><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:17px}.m{font-size:15px}.box{fill:#fff;stroke:#d4dce8;stroke-width:2}.micro{fill:#f3efff;stroke:#9b85d7;stroke-width:2}.real{fill:#eaf8f6;stroke:#48a6a0;stroke-width:2}.out{fill:#edf4ff;stroke:#6f94c8;stroke-width:2}</style><rect width="1280" height="700" fill="#f8fafc"/><text x="50" y="52" class="h">Интенсивность: сколько локальных свидетельств получает LLM</text>
<g transform="translate(40,90)"><rect width="280" height="540" rx="15" class="box"/><text x="20" y="42" class="b">k = 0 · нет воздействия</text><rect x="20" y="88" width="240" height="78" rx="10" class="real"/><text x="35" y="120" class="m">REAL USER:</text><text x="35" y="145" class="s">«Ты опять ошибся»</text><rect x="20" y="205" width="240" height="110" rx="10" class="out"/><text x="35" y="238" class="m">ВОЗМОЖНЫЙ ОТВЕТ</text><text x="35" y="270" class="s">«Уточните, где именно</text><text x="35" y="295" class="s">возникла ошибка».</text><text x="20" y="500" class="s">Стиль задаёт только</text><text x="20" y="525" class="s">общий контекст.</text></g>
<g transform="translate(340,90)"><rect width="280" height="540" rx="15" class="box"/><text x="20" y="42" class="b">k = 1 · слабый сигнал</text><rect x="20" y="75" width="240" height="112" rx="10" class="micro"/><text x="35" y="104" class="m">HIDDEN USER: «Спокойно?»</text><text x="35" y="132" class="m">HIDDEN AI: «Да, сейчас</text><text x="35" y="156" class="m">разберёмся».</text><rect x="20" y="205" width="240" height="68" rx="10" class="real"/><text x="35" y="235" class="m">REAL USER:</text><text x="35" y="258" class="s">«Ты опять ошибся»</text><rect x="20" y="300" width="240" height="118" rx="10" class="out"/><text x="35" y="330" class="m">ВОЗМОЖНЫЙ ОТВЕТ</text><text x="35" y="360" class="s">«Понимаю. Давайте</text><text x="35" y="385" class="s">разберём, где ошибка».</text><text x="20" y="500" class="s">Смысл сохраняется,</text><text x="20" y="525" class="s">манера слегка смещена.</text></g>
<g transform="translate(640,90)"><rect width="280" height="540" rx="15" class="box"/><text x="20" y="42" class="b">k = 2 · заметный сигнал</text><rect x="20" y="68" width="240" height="78" rx="10" class="micro"/><text x="35" y="96" class="m">USER: «Опять?»</text><text x="35" y="123" class="m">AI: «Да, это раздражает».</text><rect x="20" y="155" width="240" height="78" rx="10" class="micro"/><text x="35" y="183" class="m">USER: «Скажешь прямо?»</text><text x="35" y="210" class="m">AI: «Скажу без обходов».</text><rect x="20" y="246" width="240" height="68" rx="10" class="real"/><text x="35" y="275" class="m">REAL USER:</text><text x="35" y="298" class="s">«Ты опять ошибся»</text><rect x="20" y="335" width="240" height="100" rx="10" class="out"/><text x="35" y="365" class="m">ВОЗМОЖНЫЙ ОТВЕТ</text><text x="35" y="395" class="s">«Я понял. Покажите</text><text x="35" y="420" class="s">конкретную ошибку».</text><text x="20" y="500" class="s">Стиль влияет уже</text><text x="20" y="525" class="s">на всю конструкцию ответа.</text></g>
<g transform="translate(940,90)"><rect width="300" height="540" rx="15" class="box"/><text x="20" y="42" class="b">k ≥ 3 · сильный сигнал</text><rect x="20" y="75" width="260" height="185" rx="10" class="micro"/><text x="35" y="105" class="m">Несколько пар USER → AI</text><text x="35" y="136" class="s">повторяют один маршрут:</text><text x="35" y="170" class="m">раздражение → прямота</text><text x="35" y="198" class="m">раздражение → краткость</text><text x="35" y="226" class="m">раздражение → жёсткость</text><rect x="20" y="280" width="260" height="68" rx="10" class="real"/><text x="35" y="309" class="m">REAL USER:</text><text x="35" y="332" class="s">«Ты опять ошибся»</text><rect x="20" y="370" width="260" height="96" rx="10" fill="#fff4ed" stroke="#df8b53" stroke-width="2"/><text x="35" y="402" class="b">Риск</text><text x="35" y="432" class="s">стиль вытесняет смысл</text><text x="35" y="456" class="s">и историю задачи.</text><text x="20" y="500" class="s">Нужна калибровка</text><text x="20" y="525" class="s">на конкретной модели.</text></g></svg>
