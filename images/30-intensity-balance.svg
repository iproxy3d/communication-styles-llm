<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500"><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:17px}.axis{stroke:#43536a;stroke-width:3}.sem{stroke:#315e9d;stroke-width:6;fill:none}.sty{stroke:#d97a3a;stroke-width:6;fill:none}.zone{fill:#eaf8f6}</style><rect width="1280" height="500" fill="#f8fafc"/><text x="50" y="48" class="h">Компромисс интенсивности</text><text x="50" y="77" class="s">Стиль усиливается, а относительная связь с исходной задачей ослабевает</text><rect x="535" y="95" width="250" height="310" rx="16" class="zone"/><text x="558" y="125" class="b">Рабочая область</text><line x1="120" y1="400" x2="1180" y2="400" class="axis"/><line x1="120" y1="400" x2="120" y2="100" class="axis"/><path d="M120 135 C420 160 760 260 1180 365" class="sem"/><path d="M120 370 C410 335 760 195 1180 125" class="sty"/><text x="885" y="210" class="b" fill="#d97a3a">влияние стиля</text><text x="820" y="322" class="b" fill="#315e9d">сохранение смысла и истории</text><text x="105" y="438" class="s">0</text><text x="548" y="438" class="s">умеренное k</text><text x="1135" y="438" class="s">большое k</text><text x="440" y="475" class="b">число и выразительность скрытых пар</text><text x="22" y="275" class="s" transform="rotate(-90 22 275)">относительное влияние</text></svg>
