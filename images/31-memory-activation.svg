<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:17px}.m{font-size:15px}.box{fill:#fff;stroke:#d2dbe8;stroke-width:2}.blue{fill:#edf4ff}.green{fill:#eaf8f6}.orange{fill:#fff4ed}.purple{fill:#f3efff}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/><text x="45" y="52" class="h">Как сущности текущей реплики активируют эмоциональную память</text>
<rect x="40" y="100" width="240" height="130" rx="14" class="blue"/><text x="60" y="135" class="b">1. Сообщение</text><text x="60" y="175" class="s">«Я встретил Ивана</text><text x="60" y="203" class="s">в аэропорту»</text><path d="M285 165H350" class="arr"/>
<rect x="365" y="100" width="220" height="130" rx="14" class="green"/><text x="385" y="135" class="b">2. Сущности</text><text x="385" y="175" class="s">x₁ = Иван</text><text x="385" y="203" class="s">x₂ = аэропорт</text><path d="M590 165H655" class="arr"/>
<rect x="670" y="75" width="290" height="185" rx="14" class="purple"/><text x="690" y="112" class="b">3. Поиск A(x)</text><text x="690" y="150" class="s">Иван:</text><text x="770" y="150" class="m">anger .40 · fear .10</text><text x="690" y="185" class="s">аэропорт:</text><text x="790" y="185" class="m">anger .05 · fear .30</text><text x="690" y="225" class="m">Это смещения, не факты и не метки.</text><path d="M965 165H1025" class="arr"/>
<rect x="1040" y="100" width="200" height="130" rx="14" class="orange"/><text x="1060" y="135" class="b">4. Aggregate</text><text x="1060" y="175" class="s">Aₜ = F(A(x₁),</text><text x="1060" y="203" class="s">A(x₂))</text>
<path d="M1140 235V315" class="arr"/><rect x="930" y="330" width="310" height="150" rx="14" class="orange"/><text x="950" y="365" class="b">5. Влияние памяти</text><text x="950" y="405" class="s">Sₜ = αUₜ + (1−α)Eₜ + βAₜ</text><text x="950" y="440" class="s">β задаёт силу прошлого опыта.</text><path d="M925 405H830" class="arr"/>
<rect x="500" y="330" width="310" height="150" rx="14" class="blue"/><text x="520" y="365" class="b">6. Policy выбирает форму</text><text x="520" y="405" class="s">поле стиля + вариант + k</text><text x="520" y="440" class="s">Память не пишет ответ напрямую.</text><path d="M495 405H400" class="arr"/>
<rect x="40" y="330" width="340" height="150" rx="14" class="green"/><text x="60" y="365" class="b">7. Микродиалог → LLM</text><text x="60" y="405" class="s">USER: «Ты насторожен?»</text><text x="60" y="435" class="s">AI: «Немного. Проверим детали».</text>
<rect x="40" y="545" width="1200" height="110" rx="14" class="box"/><text x="65" y="582" class="b">Ключевая граница</text><text x="65" y="617" class="s">Сущность активирует предрасположенность. Текущее сообщение, состояние агента и policy могут ослабить, усилить</text><text x="65" y="643" class="s">или перенаправить её. Поэтому «Иван» не означает автоматическую злость, а «самолёт» — обязательный страх.</text></svg>
