<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680"><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:17px}.m{font-size:15px}.box{fill:#fff;stroke:#d2dbe8;stroke-width:2}.seed{fill:#edf4ff}.episode{fill:#fff4ed}.memory{fill:#f3efff}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><rect width="1280" height="680" fill="#f8fafc"/><text x="45" y="52" class="h">Как формируется и меняется ассоциативная память</text>
<rect x="45" y="95" width="345" height="150" rx="14" class="seed"/><text x="65" y="130" class="b">Источник A · задано автором</text><text x="65" y="170" class="s">«праздник» → joy</text><text x="65" y="202" class="s">«экзамен» → anxiety</text><text x="65" y="228" class="m">Предсказуемая стартовая личность.</text>
<rect x="45" y="290" width="345" height="220" rx="14" class="episode"/><text x="65" y="325" class="b">Источник B · опыт диалога</text><text x="65" y="365" class="s">1. извлечь сущность x</text><text x="65" y="397" class="s">2. зафиксировать состояние Eₜ</text><text x="65" y="429" class="s">3. сохранить пару (x, Eₜ)</text><text x="65" y="468" class="m">Пример: самолёт + fear=.40</text><path d="M400 205H500" class="arr"/><path d="M400 400H500" class="arr"/>
<rect x="515" y="170" width="355" height="245" rx="14" class="memory"/><text x="535" y="207" class="b">Хранилище A(x)</text><text x="535" y="247" class="s">сущность → эмоциональный вектор</text><text x="535" y="292" class="s">Aₜ₊₁(x) = Aₜ(x) +</text><text x="535" y="320" class="s">η · (Eₜ − Aₜ(x))</text><text x="535" y="363" class="m">η мало: опыт накапливается медленно</text><text x="535" y="390" class="m">η велико: последний эпизод сильнее</text><path d="M875 292H975" class="arr"/>
<rect x="990" y="170" width="245" height="245" rx="14" class="box"/><text x="1010" y="207" class="b">Затухание</text><text x="1010" y="253" class="s">A ← γA</text><text x="1010" y="295" class="m">γ ≈ 1:</text><text x="1010" y="320" class="s">долгая память</text><text x="1010" y="357" class="m">γ меньше:</text><text x="1010" y="382" class="s">быстрое забывание</text>
<rect x="515" y="470" width="720" height="145" rx="14" fill="#eaf8f6"/><text x="535" y="508" class="b">Пример накопления, а не мгновенной смены отношения</text><text x="535" y="545" class="s">нейтральный «самолёт» → несколько тревожных эпизодов</text><text x="535" y="575" class="s">→ A(самолёт).fear растёт → новое упоминание слегка смещает Sₜ</text><text x="535" y="603" class="m">Результат — осторожный микродиалог, но не готовый ответ.</text></svg>
