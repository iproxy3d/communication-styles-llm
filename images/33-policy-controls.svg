<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740"><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:17px}.m{font-size:15px}.box{fill:#fff;stroke:#d2dbe8;stroke-width:2}.input{fill:#edf4ff}.support{fill:#eaf8f6}.game{fill:#fff0f0}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><rect width="1280" height="740" fill="#f8fafc"/><text x="45" y="52" class="h">Коммуникационный стиль как policy: два способа управления</text>
<rect x="420" y="90" width="440" height="105" rx="14" class="input"/><text x="445" y="127" class="b">Входное состояние Sₜ</text><text x="445" y="165" class="s">anger=.40 · annoyance=.20 · neutral=.10 · joy=.01</text>
<path d="M640 200V250" class="arr"/><rect x="470" y="260" width="340" height="90" rx="14" class="box"/><text x="495" y="298" class="b">Policy персонажа / продукта</text><text x="495" y="328" class="s">ограничения + характер + задача</text>
<path d="M470 330C380 365 285 390 210 425" class="arr"/><path d="M810 330C900 365 995 390 1070 425" class="arr"/>
<rect x="45" y="420" width="550" height="235" rx="15" class="support"/><text x="70" y="458" class="b">A. Изменить веса эмоциональных координат</text><text x="70" y="500" class="s">w(anger)=0 · w(annoyance)=0.2 · w(neutral)=1</text><text x="70" y="535" class="s">S′ₜ = normalize(w ⊙ Sₜ)</text><text x="70" y="575" class="m">Поддержка может подавить агрессию; игровой противник — усилить.</text><text x="70" y="610" class="m">Затем поле выбирается уже по скорректированному S′ₜ.</text>
<rect x="685" y="420" width="550" height="235" rx="15" class="game"/><text x="710" y="458" class="b">B. Перенаправить выбор микродиалога</text><text x="710" y="500" class="s">Состояние anger сохраняется, но policy выбирает:</text><text x="710" y="535" class="s">support → caring / neutral microdialog</text><text x="710" y="568" class="s">enemy → aggressive microdialog</text><text x="710" y="605" class="m">Явное правило маршрутизации:</text><text x="710" y="630" class="m">«состояние → допустимое поведение».</text>
<rect x="270" y="675" width="740" height="48" rx="12" fill="#f3efff"/><text x="310" y="706" class="b">Одинаковая LLM и одинаковый Sₜ → разные ответы из-за разной policy</text></svg>
