<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1700" height="900" fill="#f8faff"/>
<text x="850.0" y="58" text-anchor="middle" class="t h">ПОВЕДЕНИЕ ПЕРСОНАЖА РАЗВИВАЕТСЯ ВО ВРЕМЕНИ</text>
<text x="850.0" y="94" text-anchor="middle" class="t c">Каждое событие обновляет Eₜ; инерция и затухание не дают стилю мгновенно переключаться</text>
<rect x="35" y="150" width="375" height="510" rx="20" class="blue"/>
<text x="222" y="195" text-anchor="middle" class="t b">t₁</text>
<text x="222" y="245" text-anchor="middle" class="t s">Грубая реплика</text>
<text x="222" y="315" text-anchor="middle" class="t b">E: раздражение 0.20</text>
<text x="222" y="370" text-anchor="middle" class="t c">policy → микродиалог</text>
<text x="222" y="430" text-anchor="middle" class="t s">«Давайте спокойно»</text>
<text x="222" y="540" text-anchor="middle" class="t c">обновление Eₜ</text>
<path d="M415 405 L445 405" class="line"/>
<rect x="450" y="150" width="375" height="510" rx="20" class="orange"/>
<text x="637" y="195" text-anchor="middle" class="t b">t₂</text>
<text x="637" y="245" text-anchor="middle" class="t s">Повторная грубость</text>
<text x="637" y="315" text-anchor="middle" class="t b">E: раздражение 0.48</text>
<text x="637" y="370" text-anchor="middle" class="t c">policy → микродиалог</text>
<text x="637" y="430" text-anchor="middle" class="t s">«Без оскорблений»</text>
<text x="637" y="540" text-anchor="middle" class="t c">обновление Eₜ</text>
<path d="M830 405 L860 405" class="line"/>
<rect x="865" y="150" width="375" height="510" rx="20" class="pink"/>
<text x="1052" y="195" text-anchor="middle" class="t b">t₃</text>
<text x="1052" y="245" text-anchor="middle" class="t s">Третья грубость</text>
<text x="1052" y="315" text-anchor="middle" class="t b">E: раздражение 0.70</text>
<text x="1052" y="370" text-anchor="middle" class="t c">policy → микродиалог</text>
<text x="1052" y="430" text-anchor="middle" class="t s">«Я уже обозначил границу»</text>
<text x="1052" y="540" text-anchor="middle" class="t c">обновление Eₜ</text>
<path d="M1245 405 L1275 405" class="line"/>
<rect x="1280" y="150" width="375" height="510" rx="20" class="green"/>
<text x="1467" y="195" text-anchor="middle" class="t b">t₄</text>
<text x="1467" y="245" text-anchor="middle" class="t s">Пользователь спокоен</text>
<text x="1467" y="315" text-anchor="middle" class="t b">E: раздражение 0.45</text>
<text x="1467" y="370" text-anchor="middle" class="t c">policy → микродиалог</text>
<text x="1467" y="430" text-anchor="middle" class="t s">«Хорошо, продолжим»</text>
<text x="1467" y="540" text-anchor="middle" class="t c">обновление Eₜ</text>
<rect x="120" y="720" width="1460" height="110" rx="20" class="purple"/>
<text x="850" y="762" text-anchor="middle" class="t b">Eₜ₊₁ = Inertia(Eₜ) + реакция на новый сигнал; при отсутствии подкрепления состояние затухает</text>
<text x="850" y="804" text-anchor="middle" class="t s">Ассоциативная память Aₜ может дополнительно смещать траекторию, но policy ограничивает форму выражения.</text>
</svg>