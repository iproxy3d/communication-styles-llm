<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="900" viewBox="0 0 1650 900">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1650" height="900" fill="#f8faff"/>
<text x="825.0" y="58" text-anchor="middle" class="t h">СМЫСЛ ПАРАМЕТРА α</text>
<text x="825.0" y="94" text-anchor="middle" class="t c">α регулирует вклад текущего сигнала собеседника в Sₜ, но итоговое поведение всё равно ограничивает policy</text>
<rect x="300" y="115" width="1050" height="100" rx="20" class="blue"/>
<text x="825" y="160" text-anchor="middle" class="t h">Sₜ = αUₜ + (1−α)Eₜ</text>
<text x="825" y="198" text-anchor="middle" class="t c">Uₜ — собеседник · Eₜ — состояние агента · Sₜ — вектор для выбора поведения</text>
<rect x="55" y="270" width="480" height="460" rx="20" class="pink"/>
<text x="295" y="320" text-anchor="middle" class="t h">α = 1</text>
<text x="295" y="375" text-anchor="middle" class="t b">100% Uₜ · 0% Eₜ</text>
<text x="295" y="455" text-anchor="middle" class="t s">максимально реактивное состояние</text>
<text x="295" y="505" text-anchor="middle" class="t s">policy всё ещё задаёт границы</text>
<rect x="110" y="570" width="370" height="95" rx="20" class="card"/>
<text x="295" y="610" text-anchor="middle" class="t b">Sₜ → policy → selector</text>
<text x="295" y="645" text-anchor="middle" class="t c">→ HIDDEN USER → HIDDEN AI</text>
<rect x="585" y="270" width="480" height="460" rx="20" class="orange"/>
<text x="825" y="320" text-anchor="middle" class="t h">α = 0.3</text>
<text x="825" y="375" text-anchor="middle" class="t b">30% Uₜ · 70% Eₜ</text>
<text x="825" y="455" text-anchor="middle" class="t s">собственное состояние преобладает</text>
<text x="825" y="505" text-anchor="middle" class="t s">сигнал собеседника всё же влияет</text>
<rect x="640" y="570" width="370" height="95" rx="20" class="card"/>
<text x="825" y="610" text-anchor="middle" class="t b">Sₜ → policy → selector</text>
<text x="825" y="645" text-anchor="middle" class="t c">→ HIDDEN USER → HIDDEN AI</text>
<rect x="1115" y="270" width="480" height="460" rx="20" class="green"/>
<text x="1355" y="320" text-anchor="middle" class="t h">α = 0</text>
<text x="1355" y="375" text-anchor="middle" class="t b">0% Uₜ · 100% Eₜ</text>
<text x="1355" y="455" text-anchor="middle" class="t s">состояние не перенимает текущий тон</text>
<text x="1355" y="505" text-anchor="middle" class="t s">policy выбирает форму реакции</text>
<rect x="1170" y="570" width="370" height="95" rx="20" class="card"/>
<text x="1355" y="610" text-anchor="middle" class="t b">Sₜ → policy → selector</text>
<text x="1355" y="645" text-anchor="middle" class="t c">→ HIDDEN USER → HIDDEN AI</text>
<text x="825" y="820" text-anchor="middle" class="t b">α не является «силой эмоции» и не выбирает готовый ответ напрямую.</text>
</svg>