<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1900" height="1080" fill="#f8faff"/>
<text x="950.0" y="58" text-anchor="middle" class="t h">ПОЛНАЯ АРХИТЕКТУРА ОДНОГО ШАГА</text>
<text x="950.0" y="94" text-anchor="middle" class="t c">Состояние, policy, коммуникационный и мотивационный слои, контекст LLM и обновление памяти</text>
<rect x="35" y="125" width="420" height="115" rx="20" class="blue"/>
<text x="245" y="165" text-anchor="middle" class="t b">1. REAL USER Xₜ</text>
<text x="245" y="205" text-anchor="middle" class="t c">текст / речь</text>
<rect x="500" y="125" width="420" height="115" rx="20" class="pink"/>
<text x="710" y="165" text-anchor="middle" class="t b">2. Uₜ</text>
<text x="710" y="205" text-anchor="middle" class="t c">эмоции пользователя</text>
<rect x="965" y="125" width="420" height="115" rx="20" class="green"/>
<text x="1175" y="165" text-anchor="middle" class="t b">3. Eₜ</text>
<text x="1175" y="205" text-anchor="middle" class="t c">состояние агента</text>
<rect x="1430" y="125" width="420" height="115" rx="20" class="orange"/>
<text x="1640" y="165" text-anchor="middle" class="t b">4. Aₜ</text>
<text x="1640" y="205" text-anchor="middle" class="t c">ассоциативная память</text>
<path d="M950 255 L950 325" class="line"/>
<rect x="625" y="340" width="650" height="110" rx="20" class="orange"/>
<text x="950" y="382" text-anchor="middle" class="t b">5. Sₜ = αUₜ + (1−α)Eₜ + βAₜ</text>
<text x="950" y="420" text-anchor="middle" class="t c">общий вектор для выбора поведения</text>
<path d="M950 465 L950 525" class="line"/>
<rect x="625" y="540" width="650" height="100" rx="20" class="purple"/>
<text x="950" y="580" text-anchor="middle" class="t b">6. POLICY → SELECTOR</text>
<text x="950" y="615" text-anchor="middle" class="t c">веса · перенаправление · поле · вариант · k</text>
<path d="M610 590 L470 590" class="line"/>
<path d="M1290 590 L1430 590" class="line"/>
<rect x="65" y="505" width="390" height="230" rx="20" class="blue"/>
<text x="260" y="545" text-anchor="middle" class="t b">7. COMMUNICATION Mₜ</text>
<text x="95" y="595" text-anchor="start" class="t s">HIDDEN USER</text>
<text x="95" y="635" text-anchor="start" class="t s">HIDDEN AI</text>
<text x="95" y="690" text-anchor="start" class="t c">k полных согласованных пар</text>
<rect x="1445" y="505" width="390" height="230" rx="20" class="green"/>
<text x="1640" y="545" text-anchor="middle" class="t b">8. MOTIVATION Qₜ</text>
<text x="1480" y="595" text-anchor="start" class="t s">m = 0 → пусто</text>
<text x="1480" y="635" text-anchor="start" class="t s">m ≠ 0 → HIDDEN USER → AI</text>
<text x="1480" y="690" text-anchor="start" class="t c">регулирует инициативность</text>
<path d="M260 750 L650 820" class="line"/>
<path d="M1640 750 L1250 820" class="line"/>
<rect x="470" y="800" width="960" height="130" rx="20" class="card"/>
<text x="950" y="842" text-anchor="middle" class="t b">9. СБОРКА КОНТЕКСТА</text>
<text x="950" y="885" text-anchor="middle" class="t s">SYSTEM + Hₜ + Mₜ + Qₜ + REAL USER Xₜ</text>
<path d="M950 945 L950 995" class="line"/>
<rect x="690" y="990" width="520" height="62" rx="20" class="green"/>
<text x="950" y="1030" text-anchor="middle" class="t b">10. LLM → AI RESPONSE Yₜ</text>
<text x="80" y="1068" text-anchor="start" class="t s">После ответа: обновить Eₜ, A(x) через η и применить затухание γ</text>
</svg>