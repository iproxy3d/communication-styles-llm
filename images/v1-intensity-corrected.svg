<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1800" height="1050" fill="#f8faff"/>
<text x="900.0" y="58" text-anchor="middle" class="t h">ИНТЕНСИВНОСТЬ: ЧИСЛО ПОЛНЫХ СКРЫТЫХ ПАР k</text>
<text x="900.0" y="94" text-anchor="middle" class="t c">k считает пары USER → AI, а не отдельные сообщения</text>
<rect x="35" y="145" width="410" height="610" rx="20" class="card"/>
<text x="240" y="190" text-anchor="middle" class="t b">k = 0</text>
<text x="240" y="225" text-anchor="middle" class="t c">нет вставки</text>
<rect x="65" y="260" width="350" height="82" rx="20" class="blue"/>
<text x="240" y="295" text-anchor="middle" class="t tiny">REAL USER</text>
<text x="240" y="325" text-anchor="middle" class="t s">«Почему отменён мой рейс?»</text>
<text x="240" y="715" text-anchor="middle" class="t c">смысл: высокий · стиль: базовый</text>
<rect x="475" y="145" width="410" height="610" rx="20" class="card"/>
<text x="680" y="190" text-anchor="middle" class="t b">k = 1</text>
<text x="680" y="225" text-anchor="middle" class="t c">1 пара USER → AI</text>
<rect x="505" y="260" width="350" height="82" rx="20" class="blue"/>
<text x="680" y="295" text-anchor="middle" class="t tiny">REAL USER</text>
<text x="680" y="325" text-anchor="middle" class="t s">«Почему отменён мой рейс?»</text>
<rect x="505" y="365" width="350" height="90" rx="12" class="purple"/>
<text x="520" y="395" text-anchor="start" class="t tiny">Пара 1: HIDDEN USER</text>
<text x="520" y="420" text-anchor="start" class="t s">→ HIDDEN AI</text>
<text x="680" y="715" text-anchor="middle" class="t c">слабое локальное смещение</text>
<rect x="915" y="145" width="410" height="610" rx="20" class="card"/>
<text x="1120" y="190" text-anchor="middle" class="t b">k = 2</text>
<text x="1120" y="225" text-anchor="middle" class="t c">2 согласованные пары</text>
<rect x="945" y="260" width="350" height="82" rx="20" class="blue"/>
<text x="1120" y="295" text-anchor="middle" class="t tiny">REAL USER</text>
<text x="1120" y="325" text-anchor="middle" class="t s">«Почему отменён мой рейс?»</text>
<rect x="945" y="365" width="350" height="90" rx="12" class="purple"/>
<text x="960" y="395" text-anchor="start" class="t tiny">Пара 1: HIDDEN USER</text>
<text x="960" y="420" text-anchor="start" class="t s">→ HIDDEN AI</text>
<rect x="945" y="470" width="350" height="90" rx="12" class="purple"/>
<text x="960" y="500" text-anchor="start" class="t tiny">Пара 2: HIDDEN USER</text>
<text x="960" y="525" text-anchor="start" class="t s">→ HIDDEN AI</text>
<text x="1120" y="715" text-anchor="middle" class="t c">заметный стилевой маршрут</text>
<rect x="1355" y="145" width="410" height="610" rx="20" class="card"/>
<text x="1560" y="190" text-anchor="middle" class="t b">k = 3+</text>
<text x="1560" y="225" text-anchor="middle" class="t c">3 и более пар</text>
<rect x="1385" y="260" width="350" height="82" rx="20" class="blue"/>
<text x="1560" y="295" text-anchor="middle" class="t tiny">REAL USER</text>
<text x="1560" y="325" text-anchor="middle" class="t s">«Почему отменён мой рейс?»</text>
<rect x="1385" y="365" width="350" height="90" rx="12" class="purple"/>
<text x="1400" y="395" text-anchor="start" class="t tiny">Пара 1: HIDDEN USER</text>
<text x="1400" y="420" text-anchor="start" class="t s">→ HIDDEN AI</text>
<rect x="1385" y="470" width="350" height="90" rx="12" class="purple"/>
<text x="1400" y="500" text-anchor="start" class="t tiny">Пара 2: HIDDEN USER</text>
<text x="1400" y="525" text-anchor="start" class="t s">→ HIDDEN AI</text>
<rect x="1385" y="575" width="350" height="90" rx="12" class="purple"/>
<text x="1400" y="605" text-anchor="start" class="t tiny">Пара 3: HIDDEN USER</text>
<text x="1400" y="630" text-anchor="start" class="t s">→ HIDDEN AI</text>
<text x="1560" y="715" text-anchor="middle" class="t c">сильный эффект · риск вытеснения смысла</text>
<rect x="60" y="805" width="1680" height="155" rx="20" class="orange"/>
<text x="900" y="850" text-anchor="middle" class="t b">КОНЦЕПТУАЛЬНАЯ, НЕ ЛИНЕЙНАЯ ЗАВИСИМОСТЬ</text>
<text x="900" y="890" text-anchor="middle" class="t s">Intensity = f(k, длина, выразительность, близость к генерации, согласованность пар, конкретная LLM)</text>
<text x="900" y="930" text-anchor="middle" class="t s">Рост k обычно усиливает стиль, но эффект и потеря смысла должны измеряться экспериментально.</text>
</svg>