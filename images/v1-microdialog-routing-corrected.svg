<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1800" height="980" fill="#f8faff"/>
<text x="900.0" y="58" text-anchor="middle" class="t h">КАК МИКРОДИАЛОГ СМЕЩАЕТ ТРАЕКТОРИЮ ГЕНЕРАЦИИ</text>
<text x="900.0" y="94" text-anchor="middle" class="t c">Локальный пример меняет условное распределение продолжения, но не гарантирует конкретную реплику</text>
<rect x="45" y="130" width="520" height="610" rx="20" class="card"/>
<text x="305" y="175" text-anchor="middle" class="t b">БЕЗ МИКРОДИАЛОГА</text>
<text x="85" y="230" text-anchor="start" class="t s">Контекст: Hₜ + Xₜ</text>
<text x="85" y="285" text-anchor="start" class="t s">Возможные формы ответа:</text>
<text x="105" y="335" text-anchor="start" class="t s">нейтральная       высокая вероятность</text>
<text x="105" y="385" text-anchor="start" class="t s">формальная        средняя вероятность</text>
<text x="105" y="435" text-anchor="start" class="t s">дружеская         ниже</text>
<text x="105" y="485" text-anchor="start" class="t s">раздражённая      ниже</text>
<text x="305" y="565" text-anchor="middle" class="t b">P(Yₜ | Hₜ, Xₜ)</text>
<rect x="610" y="130" width="580" height="610" rx="20" class="card"/>
<text x="900" y="175" text-anchor="middle" class="t b">С МИКРОДИАЛОГОМ</text>
<rect x="660" y="225" width="480" height="145" rx="20" class="purple"/>
<text x="680" y="257" text-anchor="start" class="t tiny">HIDDEN USER</text>
<text x="680" y="283" text-anchor="start" class="t s">«Тебя задела грубость?»</text>
<text x="680" y="319" text-anchor="start" class="t tiny">HIDDEN AI</text>
<text x="680" y="345" text-anchor="start" class="t s">«Да, но я отвечу сдержанно и продолжу помощь»</text>
<rect x="660" y="385" width="480" height="78" rx="20" class="blue"/>
<text x="680" y="415" text-anchor="start" class="t tiny">REAL USER</text>
<text x="680" y="445" text-anchor="start" class="t s">«Тупица. Найди другой рейс»</text>
<text x="660" y="520" text-anchor="start" class="t s">Вероятность сдержанной реакции возрастает;</text>
<text x="660" y="555" text-anchor="start" class="t s">дословный ответ остаётся результатом генерации.</text>
<text x="900" y="625" text-anchor="middle" class="t b">P(Yₜ | Hₜ, Mₜ, Xₜ)</text>
<rect x="1235" y="130" width="520" height="610" rx="20" class="card"/>
<text x="1495" y="175" text-anchor="middle" class="t b">ПО ТОКЕНАМ</text>
<text x="1275" y="245" text-anchor="start" class="t b">На шаге t:</text>
<text x="1275" y="285" text-anchor="start" class="t s">распределение следующего токена</text>
<path d="M1495 315 L1495 370" class="line"/>
<text x="1275" y="415" text-anchor="start" class="t s">Выбран токен yₜ</text>
<path d="M1495 445 L1495 500" class="line"/>
<text x="1275" y="545" text-anchor="start" class="t b">На шаге t+1:</text>
<text x="1275" y="585" text-anchor="start" class="t s">новое распределение с учётом yₜ</text>
<text x="1275" y="650" text-anchor="start" class="t s">… → итоговая реплика</text>
<rect x="90" y="795" width="1620" height="110" rx="20" class="purple"/>
<text x="900" y="837" text-anchor="middle" class="t b">Важно: микродиалог — демонстрационный пример поведения, а не гарантия и не замена системных правил.</text>
<text x="900" y="878" text-anchor="middle" class="t s">Эффект, устойчивость и сохранность смысла проверяются экспериментально для конкретной LLM.</text>
</svg>