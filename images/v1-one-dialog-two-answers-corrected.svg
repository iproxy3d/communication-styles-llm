<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1600" height="950" fill="#f8faff"/>
<text x="800.0" y="58" text-anchor="middle" class="t h">ОДИН ДИАЛОГ — ДВА РАЗНЫХ ОТВЕТА</text>
<text x="800.0" y="94" text-anchor="middle" class="t c">Предметная ситуация одинакова; меняется только локальный образец поведения</text>
<rect x="300" y="125" width="1000" height="105" rx="20" class="blue"/>
<text x="800" y="165" text-anchor="middle" class="t s">AI: «К сожалению, билетов на этот рейс нет»</text>
<text x="800" y="205" text-anchor="middle" class="t b">REAL USER: «Тупица! Я опоздаю на самолёт!»</text>
<rect x="55" y="285" width="710" height="510" rx="20" class="blue"/>
<text x="410" y="330" text-anchor="middle" class="t b">БЕЗ МИКРОДИАЛОГА</text>
<rect x="835" y="285" width="710" height="510" rx="20" class="pink"/>
<text x="1190" y="330" text-anchor="middle" class="t b">С МИКРОДИАЛОГОМ</text>
<text x="105" y="395" text-anchor="start" class="t s">Реальная история + REAL USER</text>
<path d="M410 425 L410 500" class="line"/>
<rect x="235" y="515" width="350" height="85" rx="20" class="blue"/>
<text x="410" y="565" text-anchor="middle" class="t b">LLM</text>
<path d="M410 615 L410 675" class="line"/>
<rect x="120" y="690" width="580" height="75" rx="20" class="green"/>
<text x="410" y="735" text-anchor="middle" class="t s">«Понимаю. Попробуем найти другой рейс»</text>
<rect x="885" y="370" width="610" height="145" rx="20" class="purple"/>
<text x="905" y="402" text-anchor="start" class="t tiny">HIDDEN USER</text>
<text x="905" y="428" text-anchor="start" class="t s">«Как реагировать на оскорбление?»</text>
<text x="905" y="464" text-anchor="start" class="t tiny">HIDDEN AI</text>
<text x="905" y="490" text-anchor="start" class="t s">«Спокойно обозначить границу и продолжить помощь»</text>
<rect x="885" y="530" width="610" height="78" rx="20" class="blue"/>
<text x="905" y="560" text-anchor="start" class="t tiny">REAL USER</text>
<text x="905" y="590" text-anchor="start" class="t s">«Тупица! Я опоздаю на самолёт!»</text>
<path d="M1190 615 L1190 675" class="line"/>
<rect x="900" y="690" width="580" height="75" rx="20" class="green"/>
<text x="1190" y="725" text-anchor="middle" class="t s">«Давайте без оскорблений.</text>
<text x="1190" y="752" text-anchor="middle" class="t s">Я всё равно помогу найти другой рейс»</text>
<text x="800" y="865" text-anchor="middle" class="t b">Микродиалог скрыт от пользователя и не записывается как его реальные слова.</text>
</svg>