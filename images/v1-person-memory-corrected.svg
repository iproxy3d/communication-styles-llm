<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1700" height="950" fill="#f8faff"/>
<text x="850.0" y="58" text-anchor="middle" class="t h">ПАМЯТЬ ОБ ОТНОШЕНИЯХ: ПРИМЕР С ИВАНОВЫМ</text>
<text x="850.0" y="94" text-anchor="middle" class="t c">Прошлый опыт создаёт предрасположенность, но не диктует готовую реплику</text>
<rect x="40" y="135" width="470" height="500" rx="20" class="card"/>
<text x="275" y="180" text-anchor="middle" class="t b">1. ПРОШЛЫЕ ЭПИЗОДЫ</text>
<text x="80" y="250" text-anchor="start" class="t s">«Вы снова ошиблись» → раздражение</text>
<text x="80" y="305" text-anchor="start" class="t s">«Опять задержка» → недовольство</text>
<text x="80" y="360" text-anchor="start" class="t s">«Спасибо за помощь» → небольшая радость</text>
<text x="80" y="430" text-anchor="start" class="t s">Обновление каждого эпизода через η</text>
<text x="80" y="475" text-anchor="start" class="t s">и постепенное затухание через γ.</text>
<rect x="615" y="135" width="470" height="500" rx="20" class="purple"/>
<text x="850" y="180" text-anchor="middle" class="t b">2. A(ИВАНОВ)</text>
<text x="670" y="255" text-anchor="start" class="t s">anger        0.40</text>
<text x="670" y="310" text-anchor="start" class="t s">annoyance    0.50</text>
<text x="670" y="365" text-anchor="start" class="t s">sadness      0.10</text>
<text x="670" y="420" text-anchor="start" class="t s">joy          0.08</text>
<text x="670" y="500" text-anchor="start" class="t s">Эмоциональный профиль, не характеристика</text>
<text x="670" y="535" text-anchor="start" class="t s">человека и не фактографическая память.</text>
<rect x="1190" y="135" width="470" height="500" rx="20" class="orange"/>
<text x="1425" y="180" text-anchor="middle" class="t b">3. НОВОЕ «ПРИВЕТ»</text>
<text x="1235" y="245" text-anchor="start" class="t s">Uₜ почти нейтрален</text>
<text x="1235" y="295" text-anchor="start" class="t s">Eₜ — текущее состояние агента</text>
<text x="1235" y="345" text-anchor="start" class="t s">βA(Иванов) — слабое смещение</text>
<text x="1235" y="415" text-anchor="start" class="t b">Sₜ → policy</text>
<text x="1235" y="460" text-anchor="start" class="t s">→ сдержанный настороженный маршрут</text>
<text x="1235" y="520" text-anchor="start" class="t s">→ не автоматическая агрессия</text>
<path d="M520 380 L600 380" class="line"/>
<path d="M1095 380 L1175 380" class="line"/>
<rect x="165" y="720" width="1370" height="120" rx="20" class="green"/>
<text x="850" y="762" text-anchor="middle" class="t b">Sₜ = αUₜ + (1−α)Eₜ + βA(Иванов)</text>
<text x="850" y="805" text-anchor="middle" class="t s">Итоговую форму всё равно определяют характер, роль, безопасность и communication policy.</text>
</svg>