<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1800" height="1050" fill="#f8faff"/>
<text x="900.0" y="58" text-anchor="middle" class="t h">COMMUNICATION POLICY: ДВА РАЗНЫХ МЕХАНИЗМА</text>
<text x="900.0" y="94" text-anchor="middle" class="t c">Веса меняют участие координат; перенаправление меняет допустимый способ выражения</text>
<rect x="40" y="130" width="840" height="300" rx="20" class="card"/>
<text x="460" y="175" text-anchor="middle" class="t b">A. ВЗВЕШИВАНИЕ КООРДИНАТ</text>
<text x="80" y="225" text-anchor="start" class="t s">support: anger × 0.0 → координата подавлена</text>
<text x="80" y="270" text-anchor="start" class="t s">empathic: anger × 0.2 → состояние учтено мягко</text>
<text x="80" y="315" text-anchor="start" class="t s">opponent: anger × 1.5 → конфликтная реакция усилена</text>
<text x="80" y="370" text-anchor="start" class="t b">S′ₜ = Normalize(w ⊙ Sₜ)</text>
<rect x="920" y="130" width="840" height="300" rx="20" class="card"/>
<text x="1340" y="175" text-anchor="middle" class="t b">B. ПЕРЕНАПРАВЛЕНИЕ</text>
<text x="960" y="225" text-anchor="start" class="t s">anger → caring: поддержка</text>
<text x="960" y="270" text-anchor="start" class="t s">anger → restrained anger: тренажёр</text>
<text x="960" y="315" text-anchor="start" class="t s">anger → aggressive: игровой противник</text>
<text x="960" y="370" text-anchor="start" class="t s">Sₜ сохраняется для памяти и TTS; меняется выбранная ячейка</text>
<rect x="40" y="480" width="550" height="430" rx="20" class="green"/>
<text x="315" y="525" text-anchor="middle" class="t b">СЛУЖБА ПОДДЕРЖКИ</text>
<text x="315" y="565" text-anchor="middle" class="t s">anger → caring</text>
<rect x="75" y="600" width="480" height="145" rx="20" class="purple"/>
<text x="95" y="632" text-anchor="start" class="t tiny">HIDDEN USER</text>
<text x="95" y="658" text-anchor="start" class="t s">«Как ты ответишь на грубость?»</text>
<text x="95" y="694" text-anchor="start" class="t tiny">HIDDEN AI</text>
<text x="95" y="720" text-anchor="start" class="t s">«Я помогу, но давайте без оскорблений»</text>
<text x="315" y="850" text-anchor="middle" class="t c">REAL USER → LLM → ответ в допустимой манере</text>
<rect x="630" y="480" width="550" height="430" rx="20" class="orange"/>
<text x="905" y="525" text-anchor="middle" class="t b">ЭМПАТИЧНЫЙ АГЕНТ</text>
<text x="905" y="565" text-anchor="middle" class="t s">anger → restrained</text>
<rect x="665" y="600" width="480" height="145" rx="20" class="purple"/>
<text x="685" y="632" text-anchor="start" class="t tiny">HIDDEN USER</text>
<text x="685" y="658" text-anchor="start" class="t s">«Как ты ответишь на грубость?»</text>
<text x="685" y="694" text-anchor="start" class="t tiny">HIDDEN AI</text>
<text x="685" y="720" text-anchor="start" class="t s">«Понимаю напряжение. Разберёмся спокойно»</text>
<text x="905" y="850" text-anchor="middle" class="t c">REAL USER → LLM → ответ в допустимой манере</text>
<rect x="1220" y="480" width="550" height="430" rx="20" class="pink"/>
<text x="1495" y="525" text-anchor="middle" class="t b">ИГРОВОЙ ПРОТИВНИК</text>
<text x="1495" y="565" text-anchor="middle" class="t s">anger → aggressive</text>
<rect x="1255" y="600" width="480" height="145" rx="20" class="purple"/>
<text x="1275" y="632" text-anchor="start" class="t tiny">HIDDEN USER</text>
<text x="1275" y="658" text-anchor="start" class="t s">«Как ты ответишь на грубость?»</text>
<text x="1275" y="694" text-anchor="start" class="t tiny">HIDDEN AI</text>
<text x="1275" y="720" text-anchor="start" class="t s">«Попробуй справиться сам, если сможешь»</text>
<text x="1495" y="850" text-anchor="middle" class="t c">REAL USER → LLM → ответ в допустимой манере</text>
<text x="900" y="980" text-anchor="middle" class="t b">Одинаковые Uₜ, Eₜ и LLM не гарантируют одинаковый ответ: различается policy персонажа.</text>
</svg>