<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="980" viewBox="0 0 1650 980">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1650" height="980" fill="#f8faff"/>
<text x="825.0" y="58" text-anchor="middle" class="t h">ТАБЛИЦА КОММУНИКАЦИОННОГО СТИЛЯ</text>
<text x="825.0" y="94" text-anchor="middle" class="t c">Одна запись стиля содержит строковые поля эмоций; каждая ячейка хранит полную пару USER → AI</text>
<rect x="45" y="130" width="1040" height="600" rx="20" class="card"/>
<text x="565" y="175" text-anchor="middle" class="t b">ПРОФИЛЬ: ДРУЖЕСКИЙ, СДЕРЖАННЫЙ</text>
<rect x="75" y="210" width="170" height="72" rx="12" class="blue"/>
<text x="160" y="254" text-anchor="middle" class="t b">fear</text>
<rect x="265" y="210" width="785" height="72" rx="12" class="purple"/>
<text x="290" y="239" text-anchor="start" class="t s">HIDDEN USER: «Ты волнуешься?»</text>
<text x="290" y="268" text-anchor="start" class="t s">HIDDEN AI: «Немного. Давай всё спокойно проверим»</text>
<rect x="75" y="305" width="170" height="72" rx="12" class="blue"/>
<text x="160" y="349" text-anchor="middle" class="t b">anger</text>
<rect x="265" y="305" width="785" height="72" rx="12" class="purple"/>
<text x="290" y="334" text-anchor="start" class="t s">HIDDEN USER: «Почему ты так резко?»</text>
<text x="290" y="363" text-anchor="start" class="t s">HIDDEN AI: «Это раздражает, но я не хочу ссориться»</text>
<rect x="75" y="400" width="170" height="72" rx="12" class="blue"/>
<text x="160" y="444" text-anchor="middle" class="t b">joy</text>
<rect x="265" y="400" width="785" height="72" rx="12" class="purple"/>
<text x="290" y="429" text-anchor="start" class="t s">HIDDEN USER: «Ты рад?»</text>
<text x="290" y="458" text-anchor="start" class="t s">HIDDEN AI: «Ещё бы! Это действительно здорово»</text>
<rect x="75" y="495" width="170" height="72" rx="12" class="blue"/>
<text x="160" y="539" text-anchor="middle" class="t b">sadness</text>
<rect x="265" y="495" width="785" height="72" rx="12" class="purple"/>
<text x="290" y="524" text-anchor="start" class="t s">HIDDEN USER: «Тебе грустно?»</text>
<text x="290" y="553" text-anchor="start" class="t s">HIDDEN AI: «Да. Но давай подумаем, что можно сделать»</text>
<rect x="75" y="590" width="170" height="72" rx="12" class="blue"/>
<text x="160" y="634" text-anchor="middle" class="t b">neutral</text>
<rect x="265" y="590" width="785" height="72" rx="12" class="purple"/>
<text x="290" y="619" text-anchor="start" class="t s">пусто</text>
<text x="290" y="648" text-anchor="start" class="t s">микродиалог не добавляется</text>
<rect x="1130" y="130" width="475" height="600" rx="20" class="card"/>
<text x="1367" y="175" text-anchor="middle" class="t b">КАК ВЫБИРАЕТСЯ ЯЧЕЙКА</text>
<text x="1170" y="240" text-anchor="start" class="t s">1. Профиль персонажа задаёт стиль</text>
<text x="1170" y="290" text-anchor="start" class="t s">2. Sₜ определяет поле эмоции</text>
<text x="1170" y="340" text-anchor="start" class="t s">3. Policy может перенаправить поле</text>
<text x="1170" y="390" text-anchor="start" class="t s">4. Селектор выбирает вариант</text>
<text x="1170" y="440" text-anchor="start" class="t s">5. Интенсивность задаёт число пар k</text>
<text x="1170" y="515" text-anchor="start" class="t b">Пустое поле:</text>
<text x="1170" y="555" text-anchor="start" class="t s">вставки нет; REAL USER остаётся</text>
<text x="1170" y="585" text-anchor="start" class="t s">последним сообщением перед генерацией</text>
<rect x="180" y="790" width="1290" height="105" rx="20" class="green"/>
<text x="825" y="830" text-anchor="middle" class="t b">ИСПОЛНЯЕМЫЙ ПОРЯДОК</text>
<text x="825" y="872" text-anchor="middle" class="t b">Hₜ → HIDDEN USER → HIDDEN AI → REAL USER → AI RESPONSE</text>
</svg>