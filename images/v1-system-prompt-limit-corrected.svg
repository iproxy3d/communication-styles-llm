<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1700" height="900" fill="#f8faff"/>
<text x="850.0" y="58" text-anchor="middle" class="t h">SYSTEM PROMPT И ЛОКАЛЬНЫЙ МИКРОДИАЛОГ</text>
<text x="850.0" y="94" text-anchor="middle" class="t c">Проблема не в исчезновении system prompt, а в его статичности и недостаточной конкретности для каждого шага</text>
<rect x="45" y="145" width="470" height="560" rx="20" class="card"/>
<text x="280" y="190" text-anchor="middle" class="t b">КОРОТКИЙ ДИАЛОГ</text>
<rect x="95" y="245" width="370" height="115" rx="20" class="purple"/>
<text x="280" y="285" text-anchor="middle" class="t b">SYSTEM</text>
<text x="280" y="325" text-anchor="middle" class="t c">роль · безопасность · общие правила</text>
<path d="M280 375 L280 445" class="line"/>
<rect x="95" y="460" width="370" height="95" rx="20" class="blue"/>
<text x="280" y="515" text-anchor="middle" class="t b">REAL USER → LLM</text>
<text x="280" y="635" text-anchor="middle" class="t s">Общего правила часто достаточно</text>
<rect x="615" y="145" width="470" height="560" rx="20" class="card"/>
<text x="850" y="190" text-anchor="middle" class="t b">ДЛИННАЯ ИСТОРИЯ</text>
<rect x="665" y="235" width="370" height="85" rx="20" class="purple"/>
<text x="850" y="285" text-anchor="middle" class="t b">SYSTEM</text>
<text x="850" y="360" text-anchor="middle" class="t s">H₁ → Y₁ → H₂ → Y₂ → … → Hₜ</text>
<text x="850" y="430" text-anchor="middle" class="t s">System prompt продолжает задавать рамки,</text>
<text x="850" y="470" text-anchor="middle" class="t s">но не является свежим примером реакции</text>
<text x="850" y="510" text-anchor="middle" class="t s">на конкретную ситуацию текущего шага.</text>
<rect x="1185" y="145" width="470" height="560" rx="20" class="card"/>
<text x="1420" y="190" text-anchor="middle" class="t b">ДИНАМИЧЕСКИЙ ШАГ</text>
<text x="1225" y="250" text-anchor="start" class="t s">SYSTEM + Hₜ</text>
<path d="M1420 275 L1420 335" class="line"/>
<rect x="1235" y="350" width="370" height="145" rx="20" class="purple"/>
<text x="1260" y="385" text-anchor="start" class="t tiny">HIDDEN USER</text>
<text x="1260" y="420" text-anchor="start" class="t tiny">HIDDEN AI</text>
<text x="1260" y="462" text-anchor="start" class="t s">свежий локальный образец</text>
<path d="M1420 510 L1420 565" class="line"/>
<rect x="1235" y="580" width="370" height="85" rx="20" class="green"/>
<text x="1420" y="630" text-anchor="middle" class="t b">REAL USER → LLM</text>
<rect x="120" y="760" width="1460" height="85" rx="20" class="orange"/>
<text x="850" y="800" text-anchor="middle" class="t b">SYSTEM задаёт постоянные рамки; микродиалог уточняет форму только текущего ответа.</text>
</svg>