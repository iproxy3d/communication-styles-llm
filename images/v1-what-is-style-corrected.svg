<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#17233b}.h{font-size:38px;font-weight:800}.b{font-size:24px;font-weight:750}.s{font-size:19px}.c{font-size:16px;fill:#617087}.tiny{font-size:14px}.card{fill:#fff;stroke:#d7dfeb;stroke-width:2}.blue{fill:#edf4ff;stroke:#557fbb}.pink{fill:#fff0f4;stroke:#cf688b}.green{fill:#ecf8f2;stroke:#4c9c72}.orange{fill:#fff5df;stroke:#d99a3b}.purple{fill:#f3efff;stroke:#755bc2}.dash{stroke-dasharray:9 7}.line{fill:none;stroke:#5975bb;stroke-width:4;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5975bb"/></marker></defs>
<rect width="1600" height="1000" fill="#f8faff"/>
<text x="800.0" y="58" text-anchor="middle" class="t h">ЧТО ТАКОЕ КОММУНИКАЦИОННЫЙ СТИЛЬ</text>
<text x="800.0" y="94" text-anchor="middle" class="t c">Эмоция отвечает «что чувствует персонаж», стиль — «как он это выражает»</text>
<text x="400" y="145" text-anchor="middle" class="t b">ОДНА ЭМОЦИЯ: РАЗДРАЖЕНИЕ</text>
<rect x="70" y="185" width="590" height="110" rx="20" class="green"/>
<text x="95" y="223" text-anchor="start" class="t b">Дружеский</text>
<text x="95" y="263" text-anchor="start" class="t s">Ну вот, опять эта история. Разберёмся.</text>
<rect x="720" y="185" width="590" height="110" rx="20" class="blue"/>
<text x="745" y="223" text-anchor="start" class="t b">Формальный</text>
<text x="745" y="263" text-anchor="start" class="t s">Сохраним корректный тон и рассмотрим варианты.</text>
<rect x="70" y="330" width="590" height="110" rx="20" class="orange"/>
<text x="95" y="368" text-anchor="start" class="t b">Ироничный</text>
<text x="95" y="408" text-anchor="start" class="t s">Прекрасно. Именно этого нам не хватало.</text>
<rect x="720" y="330" width="590" height="110" rx="20" class="purple"/>
<text x="745" y="368" text-anchor="start" class="t b">Холодный</text>
<text x="745" y="408" text-anchor="start" class="t s">Раздражение не изменит доступность билетов.</text>
<rect x="70" y="505" width="1460" height="390" rx="20" class="card"/>
<text x="800" y="550" text-anchor="middle" class="t b">КАК СТИЛЬ ПОПАДАЕТ В КОНТЕКСТ LLM</text>
<rect x="105" y="600" width="260" height="120" rx="20" class="pink"/>
<text x="235" y="642" text-anchor="middle" class="t b">Uₜ, Eₜ, Aₜ</text>
<text x="235" y="680" text-anchor="middle" class="t c">сигналы состояния</text>
<path d="M375 660 L470 660" class="line"/>
<rect x="485" y="600" width="260" height="120" rx="20" class="orange"/>
<text x="615" y="642" text-anchor="middle" class="t b">Sₜ + policy</text>
<text x="615" y="680" text-anchor="middle" class="t c">разрешённая реакция</text>
<path d="M755 660 L850 660" class="line"/>
<rect x="865" y="580" width="320" height="160" rx="20" class="purple"/>
<text x="1025" y="615" text-anchor="middle" class="t b">ВЫБРАННАЯ ПАРА</text>
<text x="890" y="650" text-anchor="start" class="t s">HIDDEN USER: «Что случилось?»</text>
<text x="890" y="690" text-anchor="start" class="t s">HIDDEN AI: «Я раздражён, но помогу»</text>
<path d="M1195 660 L1280 660" class="line"/>
<rect x="1295" y="600" width="200" height="120" rx="20" class="green"/>
<text x="1395" y="642" text-anchor="middle" class="t b">REAL USER</text>
<text x="1395" y="680" text-anchor="middle" class="t s">→ LLM → ответ</text>
<text x="800" y="805" text-anchor="middle" class="t s">Скрытая пара не сохраняется в реальной истории и не добавляет фактов о задаче.</text>
<text x="800" y="850" text-anchor="middle" class="t b">Канонический порядок: HIDDEN USER → HIDDEN AI → REAL USER → AI RESPONSE</text>
</svg>